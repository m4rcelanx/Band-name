<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Band-Kette">
<meta name="theme-color" content="#15121F">
<title>Band-Kette</title>
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: eine Spalte wie eine Setlist; Songs als Karten, dazwischen Verbindungslinien mit dem Beleg */
:root{
  --bg:#15121F; --surface:#1F1B2D; --surface2:#2A2540; --line:#3A3456;
  --fg:#F4EFE6; --muted:#A79FBD; --accent:#FF6B3D; --accent-ink:#1A0E08;
  --ok:#5ED3A5; --band:#93A9FF; --claim:#F2C14E; --bad:#FF5C7A;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--band)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;line-height:1.05}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:600}
p{margin:0}
.eyebrow{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.iconbtn:disabled{opacity:.4}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px;font:13px/1.4 var(--f-mono);color:var(--fg);resize:vertical}
input[type=text],input[type=search]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px}
input::placeholder{color:var(--muted)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.toggle{flex-direction:row;justify-content:space-between;align-items:center;color:var(--fg);font-size:14px;gap:12px}
.toggle small{display:block;color:var(--muted);font-size:12px}
.toggle input,.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.check{flex-direction:row;align-items:center;gap:10px;color:var(--fg);font-size:14px}

.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.pick{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:92px;min-width:0}
.pick.set{border-style:solid;border-color:var(--accent)}
.pick b{font-family:var(--f-display);font-size:16px;overflow-wrap:anywhere}
.arrow{align-self:center;font:600 18px var(--f-mono);color:var(--accent)}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .txt{min-width:0;flex:1}
.item .t1{font-weight:600;overflow-wrap:anywhere}
.item .t2{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .t2 mark{background:none;color:var(--ok);font-weight:600}
.tag{font:500 11px/1 var(--f-mono);padding:5px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);flex:none;white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag.win{background:var(--accent);color:var(--accent-ink)}
.tag.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.tag.claim{background:color-mix(in srgb,var(--claim) 18%,transparent);color:var(--claim)}

.gamehead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.route{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.route b{font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stats{display:flex;gap:14px;font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats b{color:var(--fg)}

.chain{display:flex;flex-direction:column}
.node{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.node.endpoint{background:transparent;border-style:dashed}
.node.endpoint.reached{border-style:solid;border-color:var(--accent)}
.node .txt{min-width:0;flex:1}
.node .t1{font-weight:600;overflow-wrap:anywhere}
.node .t2{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.num{font:500 12px var(--f-mono);color:var(--muted);min-width:22px;text-align:center;flex:none}
.play{font:500 11px var(--f-mono);color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 8px;flex:none}
.link{display:flex;align-items:stretch;gap:12px;padding-left:20px;min-height:34px}
.link .bar{width:3px;border-radius:2px;background:var(--ok);flex:none}
.link.band .bar{background:var(--band)}
.link.claim .bar{background:repeating-linear-gradient(var(--claim) 0 6px,transparent 6px 10px)}
.link.bad .bar{background:var(--bad)}
.link .lbl{font:500 12px/1.4 var(--f-mono);color:var(--ok);padding:7px 0;min-width:0;overflow-wrap:anywhere}
.link.band .lbl{color:var(--band)} .link.claim .lbl{color:var(--claim)} .link.bad .lbl{color:var(--bad)}
.link .lbl a{color:inherit}

.alt{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.alt:first-of-type{border-top:0;padding-top:0}
.altroute{font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.altroute .arrow{font-size:13px}
.altsteps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.altsteps a{color:var(--fg)}
.rankbar{display:flex;flex-direction:column;gap:8px;width:100%}
.rankrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rankrow b{font-family:var(--f-display);font-size:18px}
.meter{height:8px;border-radius:999px;background:var(--bg);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:999px}
.profilecard{text-align:left;cursor:pointer;color:var(--fg)}
.fg{color:var(--fg)}
.linkbtn{background:none;border:0;color:var(--band);font-size:13px;padding:4px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{text-align:left;cursor:pointer;color:var(--fg);gap:4px}
.tile b{font-family:var(--f-display);font-size:17px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.statgrid div{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.statgrid b{font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.statgrid span{font-size:12px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{border:1px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;opacity:.55}
.badge.on{opacity:1;border-style:solid;border-color:var(--accent)}
.badge b{font-size:14px}.badge span{font-size:12px;color:var(--muted)}.badge .when{color:var(--accent)}
.pts{font:800 28px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.scorelines{display:flex;flex-direction:column;gap:4px;font-size:14px}
.scorelines div{display:flex;justify-content:space-between;gap:10px}
.scorelines b{font-variant-numeric:tabular-nums}
details.panel summary{cursor:pointer;font-weight:600}
select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px}
.chip.on{background:var(--ok);border-color:var(--ok);color:#0B1F17;font-weight:600}
.chip.hint{border-style:dashed;color:var(--band)}
.chip.hint.on{background:var(--band);border-color:var(--band);color:#0E1430}

.sheet{position:fixed;inset:0;background:rgba(8,6,14,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>.card{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}
.busy{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hero{text-align:center;display:flex;flex-direction:column;gap:6px;padding:10px 0}
.big{font:800 54px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.verdict{border-radius:12px;padding:12px 14px;font-weight:600}
.verdict.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.verdict.claim{background:color-mix(in srgb,var(--claim) 15%,transparent);color:var(--claim)}
.verdict.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
@media (prefers-reduced-motion:reduce){.shake,.spin{animation:none}}
#player{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;box-shadow:0 -8px 24px rgba(0,0,0,.35)}
#player>*{width:100%;max-width:640px;margin:0 auto}
.plrow{display:flex;align-items:center;gap:10px;min-width:0}
.plrow .txt{min-width:0;flex:1}
.plrow .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plrow .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plart{width:44px;height:44px;border-radius:8px;background:var(--surface2);flex:none;object-fit:cover}
.pltime{font:500 11px var(--f-mono);color:var(--muted);min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
#player input[type=range]{flex:1;min-width:0;accent-color:var(--accent);padding:0;min-height:24px;background:none;border:0}
.plctl{justify-content:center}
.plctl .iconbtn{width:44px;height:44px;color:var(--fg)}
.plctl .iconbtn:disabled{opacity:.35}
.plctl .plbig{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0}
.plvol{display:flex;align-items:center;gap:6px;flex:1;max-width:160px;color:var(--muted)}
.plmsg{margin:0;color:var(--claim)}
.pllinks{gap:8px;flex-wrap:wrap}
.pbtn{cursor:pointer;background:none;min-width:34px}
.pbtn.on{color:var(--accent);border-color:var(--accent)}
.songbtns{display:flex;gap:6px;flex:none}
body.hasplayer #app{padding-bottom:230px}
body.hasplayer.hasembed #app{padding-bottom:300px}
#spHost iframe{display:block;width:100%;border:0;border-radius:12px}
#plUi{display:flex;flex-direction:column;gap:6px}
body.hasplayer .toast{bottom:calc(220px + env(safe-area-inset-bottom,0px))}

/* ---- Bedienung, Überarbeitung ---- */
.me{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--fg);text-align:left}
.mename{display:flex;flex-direction:column;line-height:1.15}
.mename b{font-family:var(--f-display);font-size:15px}
.mename span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.me .meter{height:6px;background:var(--bg)}
.streak{display:inline-flex;align-items:center;gap:4px;font:700 14px var(--f-mono);color:var(--muted)}
.streak.on{color:var(--accent)}
.intro{border-color:var(--accent)}
.howto{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:12px}
.howto li{counter-increment:st;display:grid;grid-template-columns:30px 1fr;column-gap:10px;align-items:start}
.howto li::before{content:counter(st);grid-row:span 2;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 14px var(--f-display)}
.howto b{font-size:15px}
.howto span{font-size:13px;color:var(--muted)}
.example{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:12px;padding:12px 14px;font-size:13px}
.example span{font-weight:600}
.example i{font-style:normal;color:var(--ok);font:500 12px var(--f-mono);padding-left:12px;border-left:2px solid var(--ok);margin-left:4px}
.resume{border-color:var(--accent)}
.vs{grid-template-columns:1fr 40px 1fr}
.swap{align-self:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--accent)}
.swap:disabled{opacity:.35}
.pick{cursor:pointer;color:var(--fg)}
.addband{color:var(--accent);font-weight:600}
.iconlink{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dicebtn{background:var(--surface2);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:7px 14px 7px 10px}
.dicebtn svg{color:var(--accent)}
.dicebtn:active{transform:scale(.97)}
.btn.primary:disabled{background:var(--surface2);color:var(--muted);opacity:1}
.row.minor>.btn{min-height:40px;padding:9px 12px;font-size:13px}
.btn.small{min-height:36px;padding:7px 12px;font-size:13px}
.tiles{gap:10px}
.tile{padding:14px;gap:4px;align-items:flex-start;min-height:118px}
.tile svg{color:var(--accent);margin-bottom:4px}
.tile b{font-size:16px}
.toolbtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:52px;padding:6px 8px;font-size:11px;color:var(--fg);flex:none}
.toolbtn:disabled{opacity:.4}
.nextpanel h3{font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .btn{min-height:44px;padding:10px;font-size:14px}
.actions{gap:10px}
.levelpick{display:flex;flex-direction:column;gap:8px}
.lvlrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lvlchip{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);border-radius:10px;padding:7px 4px;background:var(--bg);color:var(--muted)}
.lvlchip b{font-size:13px}
.lvlchip small{font:500 10px var(--f-mono);opacity:.85}
.lvlchip.on{border-width:2px;padding:6px 3px}
.lvlchip.lvl-leicht.on{border-color:var(--ok);color:var(--ok)}
.lvlchip.lvl-mittel.on{border-color:var(--band);color:var(--band)}
.lvlchip.lvl-schwer.on{border-color:var(--accent);color:var(--accent)}
.lvlchip.lvl-profi.on{border-color:var(--bad);color:var(--bad)}
.lvlchip.lvl-legende.on{border-color:var(--claim);color:var(--claim)}
.lvlchip.lvl-marathon{background:color-mix(in srgb,var(--fg) 12%,transparent);color:var(--fg)}
.lvlchip.lvl-marathon.on{border-color:var(--fg)}
.lvlchip.on b::before{content:'✓ '}
.lvlchoice{display:flex;flex-direction:column;gap:8px}
.lvlbtn{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:var(--fg);min-height:60px}
.lvlbtn.on{border-color:var(--accent)}
.lvlbtn .lvl{min-width:96px;text-align:center}
.lvlbtn .txt{display:flex;flex-direction:column}
.lvlbtn small{color:var(--muted);font-size:12px}
.seg4{grid-template-columns:repeat(4,1fr)}
.seg4 button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px}
.seg4 button b{font-size:13px}
.seg4 button small{font:500 10px var(--f-mono);color:var(--muted);font-weight:400}
.dicebtn{align-self:flex-start}
.levelinfo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvl{display:inline-block;font:700 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;padding:5px 8px;border-radius:999px;vertical-align:middle}
.lvl-leicht{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.lvl-mittel{background:color-mix(in srgb,var(--band) 20%,transparent);color:var(--band)}
.lvl-schwer{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.lvl-profi{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
.lvl-legende{background:color-mix(in srgb,var(--claim) 22%,transparent);color:var(--claim)}
.lvl-marathon{background:var(--fg);color:var(--bg)}
.toggle input[type=checkbox]{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
.toggle input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.toggle input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.toggle input[type=checkbox]:checked::after{transform:translateX(18px);background:var(--accent-ink)}
.routeline{font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.routeline .arrow{font-size:18px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="sheetRoot"></div>
<div id="player" hidden aria-label="Player"><div id="plUi"></div><div id="spHost" hidden></div></div>

<script>

const $ = s => document.querySelector(s);

/* ============ MusicBrainz-Zugriff (max. 1 Anfrage pro Sekunde) ============ */
const MB = 'https://musicbrainz.org/ws/2/';
const queue = []; let pumping = false, lastCall = 0;
function mb(path, prio = 'low', kind = ''){
  return new Promise((res, rej) => {
    const job = { path, res, rej, kind };
    if(kind === 'search'){ for(let i = queue.length - 1; i >= 0; i--) if(queue[i].kind === 'search'){ queue[i].rej(Object.assign(new Error('veraltet'), {stale:true})); queue.splice(i, 1); } }
    if(prio === 'high') queue.unshift(job); else queue.push(job);
    pump();
  });
}
async function pump(){
  if(pumping) return; pumping = true;
  while(queue.length){
    const job = queue.shift();
    const wait = lastCall + 1100 - Date.now(); if(wait > 0) await sleep(wait);
    lastCall = Date.now();
    try{ job.res(await mbFetch(job.path)); }catch(e){ job.rej(e); }
  }
  pumping = false;
}
async function mbFetch(path, tries = 0){
  let r;
  try{ r = await fetch(MB + path + (path.includes('?') ? '&' : '?') + 'fmt=json', { headers:{ Accept:'application/json' } }); }
  catch(e){ throw new Error('Keine Verbindung zu MusicBrainz. Bist du online?'); }
  if((r.status === 503 || r.status === 429) && tries < 3){ await sleep(1500 * (tries + 1)); return mbFetch(path, tries + 1); }
  if(r.status === 404) throw Object.assign(new Error('Eintrag in MusicBrainz nicht gefunden'), {status:404});
  if(!r.ok) throw new Error('MusicBrainz antwortet mit Fehler ' + r.status);
  return r.json();
}
const luc = s => s.replace(/([+\-!(){}\[\]^"~*?:\\\/]|&&|\|\|)/g, '\\$1');
function handleErr(e){ if(e && e.stale) return; console.error(e); toast(e.message || 'Unbekannter Fehler'); }

const TYPE_DE = { Group:'Band', Person:'Person', Orchestra:'Orchester', Choir:'Chor', Character:'Figur' };
function artistPick(a){ return { id:a.id, name:a.name, type:a.type || '', country:a.country || '', dis:a.disambiguation || '' }; }
function artistMeta(a){ return [TYPE_DE[a.type] || a.type, a.country, a.dis].filter(Boolean).join(' · '); }

async function searchArtists(q){
  const r = await mb('artist?limit=15&query=' + encodeURIComponent(luc(q)), 'high', 'search');
  return (r.artists || []).map(artistPick);
}
async function findArtist(name, country){
  const exact = l => l.find(a => a.name.toLowerCase() === name.toLowerCase());
  if(country){
    const r = await mb('artist?limit=10&query=' + encodeURIComponent(`artist:"${luc(name)}" AND country:${country}`), 'high');
    const hit = exact((r.artists || []).map(artistPick)); if(hit) return hit;
  }
  const r2 = await mb('artist?limit=10&query=' + encodeURIComponent(`artist:"${luc(name)}"`), 'high');
  const l2 = (r2.artists || []).map(artistPick);
  return exact(l2) || l2[0] || null;
}
function recPick(r){ const out = recPickRaw(r); recordRec(out); return out; }
/* Remixe zählen nicht: erkannt am Titel oder an der Beschreibung der Aufnahme */
const REMIX_RE = /\b(re-?mix(es|ed)?|rmx|re-?work(ed)?|re-?edit|bootleg|mash-?up)\b/i;
const MIX_RE = /[\(\[][^\)\]]*\bmix(ed)?\b[^\)\]]*[\)\]]|\s[-–]\s.*\bmix\b/i;
const isRemixTitle = (title, comment) => REMIX_RE.test(title || '') || (MIX_RE.test(title || '') && !/\boriginal mix\b/i.test(title)) || REMIX_RE.test(comment || '');
function recPickRaw(r){
  const ac = r['artist-credit'] || [];
  return { id:r.id, title:r.title,
    artists:ac.filter(c => c.artist).map(c => ({ id:c.artist.id, name:c.artist.name })),
    credit:ac.map(c => (c.name || (c.artist && c.artist.name) || '') + (c.joinphrase || '')).join(''),
    year:(r['first-release-date'] || '').slice(0, 4), video:!!r.video, remix:isRemixTitle(r.title, r.disambiguation) };
}
async function searchRecordings(query, offset){
  const r = await mb(`recording?limit=100&offset=${offset}&query=` + encodeURIComponent(query), 'high', 'search');
  return { items:(r.recordings || []).map(recPick), total:r.count || 0 };
}
async function getRecording(id){ return recPick(await mb('recording/' + id + '?inc=artist-credits', 'high')); }

const spTrackUrl = id => 'https://open.spotify.com/track/' + id;
const SPID = /^[A-Za-z0-9]{22}$/;
function parseSpotifyIds(text){
  const ids = []; const re = /(?:open\.spotify\.com\/(?:intl-[a-z]{2}(?:-[a-z]{2})?\/)?track\/|spotify:track:)([A-Za-z0-9]{22})/g; let m;
  while((m = re.exec(text))) if(!ids.includes(m[1])) ids.push(m[1]);
  return ids;
}
const normName = n => (n || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/^the\s+/, '').replace(/[^a-z0-9]+/g, '');
const cleanTitle = t => (t || '').replace(/\s+-\s+.*$/, '').replace(/\s*[\(\[][^\)\]]*[\)\]]/g, '').trim();
const normTitle = t => cleanTitle(t).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
function featNames(title){
  const m = (title || '').match(/[\(\[](?:feat\.?|ft\.?|with|mit)\s+([^\)\]]+)[\)\]]/i);
  return m ? m[1].split(/,\s*|\s+&\s+|\s+and\s+|\s+und\s+/i).map(s => s.trim()).filter(Boolean) : [];
}
const sameArtist = (a, b) => (a.id && b.id) ? a.id === b.id : normName(a.name) === normName(b.name);

/* Weg 1: MusicBrainz kennt den Spotify-Link direkt */
async function mbBySpotify(id){
  try{
    const u = await mb('url?resource=' + encodeURIComponent(spTrackUrl(id)) + '&inc=recording-rels', 'high');
    const rel = (u.relations || []).find(r => r.recording);
    return rel ? await getRecording(rel.recording.id) : null;
  }catch(e){ if(e.status === 404) return null; throw e; }
}
/* Weg 2: Odesli liefert Titel und Künstler (veraltet, darum nur als Zusatz) */
let odesliDead = false, odLast = 0;
async function odesli(url){
  if(odesliDead) return null;
  const go = async () => { const wait = odLast + 1500 - Date.now(); if(wait > 0) await sleep(wait); odLast = Date.now();
    return fetch('https://api.song.link/v1-alpha.1/links?userCountry=DE&url=' + encodeURIComponent(url)); };
  try{
    let r = await go();
    if(r.status === 429){ await sleep(8000); r = await go(); }
    if(r.status === 410){ odesliDead = true; return null; }
    if(!r.ok) return null;
    const j = await r.json(); const ents = Object.values(j.entitiesByUniqueId || {});
    const ent = ents.find(e => e.apiProvider === 'spotify' && e.type === 'song') || ents[0];
    if(!ent || !ent.title) return null;
    return { spotifyId: ent.apiProvider === 'spotify' ? ent.id : null, title: ent.title,
      artists: (ent.artistName || '').split(/,\s*|\s+&\s+/).map(s => s.trim()).filter(Boolean) };
  }catch(e){ return null; }
}
/* Weg 3: Titel aus dem öffentlichen Spotify-Einbettungsdienst */
async function spOembed(id){
  try{ const r = await fetch('https://open.spotify.com/oembed?url=' + encodeURIComponent(spTrackUrl(id))); if(!r.ok) return null; const j = await r.json(); return j.title ? { title:j.title } : null; }
  catch(e){ return null; }
}
function dedupeRecs(list){
  const seen = new Set();
  return list.filter(r => { if(r.video || r.remix) return false; const k = normTitle(r.title) + '|' + r.artists.map(a => a.id).sort().join(','); if(seen.has(k)) return false; seen.add(k); return true; });
}
async function mbCandidates(title, artist){
  let q = `recording:"${luc(cleanTitle(title))}"`;
  if(artist) q += ` AND artist:(${luc(artist)})`;
  const r = await mb('recording?limit=50&query=' + encodeURIComponent(q), 'high');
  return dedupeRecs((r.recordings || []).map(recPick));
}
function autoPick(cands, title, names, ctx){
  if(!title) return null;
  const tOk = cands.filter(r => normTitle(r.title) === normTitle(title));
  if(names.length){
    let best = null, bestHit = 0;
    for(const r of tOk){
      const hit = names.filter(n => r.artists.some(a => normName(a.name) === normName(n))).length;
      if(hit > bestHit || (hit === bestHit && best && Math.abs(r.artists.length - names.length) < Math.abs(best.artists.length - names.length))){ best = r; bestHit = hit; }
    }
    return bestHit >= 1 ? best : null;
  }
  const known = [...ctx.anchors, ctx.target].filter(a => a && a.id);
  const linked = tOk.filter(r => r.artists.some(a => known.some(k => k.id === a.id)));
  const groups = new Set(linked.map(r => r.artists.map(a => a.id).sort().join(',')));
  return groups.size === 1 ? linked[0] : null;
}
async function recFromNames(id, title, names, ctx){
  const known = [...ctx.anchors, ctx.start, ctx.target].filter(a => a && a.id);
  const artists = [];
  for(const n of names){
    const k = known.find(a => normName(a.name) === normName(n));
    if(k){ artists.push({ id:k.id, name:k.name }); continue; }
    const r = await mb('artist?limit=5&query=' + encodeURIComponent(`artist:"${luc(n)}"`), 'high');
    const hit = (r.artists || []).find(a => normName(a.name) === normName(n));
    artists.push(hit ? { id:hit.id, name:hit.name } : { id:null, name:n });
  }
  return { id:null, title:title || 'Spotify-Song', artists, credit:names.join(', '), year:'', spotifyId:id, noMb:true };
}
async function resolveSpotify(id, ctx){
  const direct = await mbBySpotify(id);
  if(direct) return { ...direct, spotifyId:id };
  const od = await odesli(spTrackUrl(id));
  let title = od ? od.title : null, names = od ? od.artists : [];
  if(!title){ const oe = await spOembed(id); title = oe ? oe.title : null; }
  if(title && isRemixTitle(title)){ toast(`„${title}“ ist ein Remix und zählt nicht`); return null; }
  if(title) names = [...new Set([...names, ...featNames(title)])];
  let cands = [];
  if(title){
    cands = await mbCandidates(title, names[0]);
    if(!autoPick(cands, title, names, ctx)) cands = dedupeRecs(cands.concat(await mbCandidates(title)));
  }
  const pick = autoPick(cands, title, names, ctx);
  if(pick) return { ...pick, spotifyId:id };
  return chooseRecording(id, title, names, cands, ctx);
}
function chooseRecording(id, title, names, cands, ctx){

    let list = cands, finished = false;
    const done = v => { if(finished) return; finished = true; closeSheet(); resolve(v); };
    sheet(`<h2>Welcher Song ist das?</h2>
      <p class="muted small">${title ? `Spotify: „${esc(title)}“${names.length ? ' von ' + esc(names.join(', ')) : ''}.` : 'Den Titel konnte ich aus dem Spotify-Link nicht lesen.'} Wähle den passenden Eintrag aus MusicBrainz, damit die Verbindung geprüft werden kann.</p>
      <a class="small" href="${spTrackUrl(id)}" target="_blank" rel="noopener">Song in Spotify ansehen</a>
      <input type="search" id="chQ" value="${esc(cleanTitle(title || ''))}" placeholder="Titel und Künstler suchen" enterkeyhint="search" autocomplete="off">
      <div class="list" id="chList"></div>
      ${names.length ? '<button class="btn ghost" id="chNoMb">Nicht dabei: mit den Spotify-Künstlern übernehmen</button>' : ''}
      <button class="btn ghost" id="chCancel">Abbrechen</button>`, () => done(null));
    const draw = () => {
      const prev = ctx.anchors;
      $('#chList').innerHTML = list.length ? list.slice(0, 30).map((r, i) => {
        const linked = r.artists.some(a => prev.some(p => p.id === a.id));
        return `<button class="item" data-ch="${i}"><div class="txt"><div class="t1">${esc(r.title)}</div><div class="t2">${esc(r.credit)}${r.year ? ' · ' + esc(r.year) : ''}</div></div>${linked ? '<span class="tag ok">gemeinsam</span>' : ''}</button>`;
      }).join('') : '<p class="muted small">Keine Treffer. Ändere oben den Suchbegriff, z. B. Titel und Künstler.</p>';
      $$('[data-ch]').forEach(b => b.onclick = () => done({ ...list[+b.dataset.ch], spotifyId:id }));
    };
    draw();
    let deb;
    $('#chQ').oninput = e => { clearTimeout(deb); deb = setTimeout(async () => {
      const q = e.target.value.trim(); if(!q) return; const lq = luc(q);
      try{ const r = await mb('recording?limit=30&query=' + encodeURIComponent(`(recording:(${lq}) OR artist:(${lq}))`), 'high'); list = dedupeRecs((r.recordings || []).map(recPick)); draw(); }
      catch(err){ handleErr(err); }
    }, 600); };
    $('#chCancel').onclick = () => done(null);
    if($('#chNoMb')) $('#chNoMb').onclick = async () => {
      const b = $('#chNoMb'); b.disabled = true; b.textContent = 'Ordne Künstler zu …';
      try{ done(await recFromNames(id, title, names, ctx)); }catch(err){ handleErr(err); done(null); }
    };
  });
}

/* Beziehungen: Mitglied, Kollaboration (Duo-Projekte), Künstlername derselben Person */
const LINK_TYPES = { 'member of band':1, 'collaboration':1, 'is person':1 };
const relCache = new Map();
function promote(path){
  const i = queue.findIndex(j => j.path === path);
  if(i > 0) queue.unshift(queue.splice(i, 1)[0]);
}
function artistInfo(id, prio = 'low'){
  if(relCache.has(id)){ if(prio === 'high') promote('artist/' + id + '?inc=artist-rels'); return relCache.get(id); }
  const p = mb('artist/' + id + '?inc=artist-rels', prio).then(a => ({
    ...artistPick(a),
    rels:(a.relations || []).filter(r => LINK_TYPES[r.type] && r.artist).map(r => ({
      type:r.type, dir:r.direction, artist:{ id:r.artist.id, name:r.artist.name },
      begin:(r.begin || '').slice(0, 4), end:(r.end || '').slice(0, 4), ended:!!r.ended }))
  }));
  relCache.set(id, p); p.then(i => { relDone.set(id, i); recordRels(i); }).catch(() => relCache.delete(id));
  return p;
}
function years(r){ return r.begin ? ` (${r.begin}–${r.ended ? (r.end || '?') : 'heute'})` : ''; }
function relText(q, r){
  const was = r.ended ? 'war' : 'ist';
  if(r.type === 'member of band') return r.dir === 'forward' ? `${q.name} ${was} Mitglied von ${r.artist.name}${years(r)}` : `${r.artist.name} ${was} Mitglied von ${q.name}${years(r)}`;
  if(r.type === 'collaboration') return r.dir === 'forward' ? `${q.name} gehört zu ${r.artist.name}` : `${r.artist.name} gehört zu ${q.name}`;
  return `${q.name} und ${r.artist.name} sind dieselbe Person`;
}

/* Kernprüfung: findet die stärkste belegbare Verbindung zwischen zwei Credit-Listen */
async function findLink(prev, next, opts, prio = 'high'){
  const shared = next.filter(a => prev.some(p => sameArtist(p, a)));
  if(shared.length) return { type:'feat', via:shared.map(a => ({id:a.id, name:a.name})) };
  if(!opts.bandLinks) return null;
  const nextIds = new Set(next.filter(a => a.id).map(a => a.id));
  const prevInfos = await Promise.all(prev.filter(p => p.id).map(p => artistInfo(p.id, prio)));
  for(const info of prevInfos){
    for(const r of info.rels){
      if(nextIds.has(r.artist.id)) return { type:'band', a:{id:info.id, name:info.name}, b:r.artist, text:relText(info, r) };
    }
  }
  if(opts.colleagues){
    const nextInfos = await Promise.all(next.filter(n => n.id).map(n => artistInfo(n.id, prio)));
    for(const pi of prevInfos){
      const pBands = pi.rels.filter(r => r.type === 'member of band' && r.dir === 'forward');
      for(const ni of nextInfos){
        for(const r of ni.rels){
          if(r.type !== 'member of band' || r.dir !== 'forward') continue;
          const hit = pBands.find(b => b.artist.id === r.artist.id);
          if(hit) return { type:'colleague', a:{id:pi.id, name:pi.name}, b:{id:ni.id, name:ni.name}, band:r.artist,
            text:`${pi.name} und ${ni.name} spielten beide bei ${r.artist.name}` };
        }
      }
    }
  }
  return null;
}

/* ============ Tipps: Wegsuche von der Kette zur Zielband ============ */
/* Knoten sind Künstler. Kanten: gemeinsamer Song (Feat) oder Bandmitgliedschaft.
   Gesucht wird von beiden Seiten gleichzeitig, bis sich die Suchräume treffen. */
const collabCache = new Map();
/* Feat-Partner aus MusicBrainz. Zuerst gezielt Aufnahmen, deren Credit ein Verbindungswort enthält
   (feat., with, x, vs., und …), bei zu wenig Treffern zusätzlich beliebige Aufnahmen.
   Sortiert nach Häufigkeit: wer öfter mitspielt, ist ein besserer Kandidat. */
const JOIN_Q = '(artist:feat OR artist:featuring OR artist:ft OR artist:with OR artist:x OR artist:vs OR artist:versus OR artist:und OR artist:and OR artist:mit OR artist:meets OR artist:presents)';
function collabsOf(id){
  if(collabCache.has(id)) return collabCache.get(id);
  const p = (async () => {
    const r1 = await mb('recording?limit=100&query=' + encodeURIComponent(`arid:${id} AND ${JOIN_Q}`), 'high');
    let recs = (r1.recordings || []).map(recPick);
    if(recs.filter(r => r.artists.length > 1).length < 8){
      const r2 = await mb('recording?limit=100&query=' + encodeURIComponent('arid:' + id), 'high');
      recs = recs.concat((r2.recordings || []).map(recPick));
    }
    const out = new Map();
    recs.forEach(rec => {
      if(rec.video || rec.remix || rec.artists.length < 2) return;
      rec.artists.forEach(a => {
        if(!a.id || a.id === id) return;
        const e = out.get(a.id); if(e){ if(e.recIds.has(rec.id)) return; e.recIds.add(rec.id); e.n++; } else out.set(a.id, { artist:a, rec, n:1, recIds:new Set([rec.id]) });
      });
    });
    return [...out.values()].sort((x, y) => y.n - x.n);
  })();
  collabCache.set(id, p); p.catch(() => collabCache.delete(id));
  return p;
}

/* Wikidata, verknüpft über die MusicBrainz-ID: Bandmitgliedschaften und gemeinsame Songs vieler Künstler
   in einer Abfrage. Nur zum schnellen Finden; alles wird vor der Anzeige in MusicBrainz belegt. */
const wdCache = new Map(), wdColCache = new Map(); let wdFails = 0, wdColFails = 0;
async function sparql(q){
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), 20000) : null;
  try{
    const r = await fetch('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q), { headers:{ Accept:'application/sparql-results+json' }, signal:ctl ? ctl.signal : undefined });
    if(!r.ok) throw new Error('Wikidata ' + r.status);
    return (await r.json()).results.bindings;
  }finally{ if(timer) clearTimeout(timer); }
}
const yr = v => v ? v.value.slice(0, 4) : '';
async function wdFetch(ids){
  if(wdFails >= 3) return;
  const need = [...new Set(ids)].filter(id => MBID.test(id) && !wdCache.has(id)).slice(0, 40);
  if(!need.length) return;
  try{
    const rows = await sparql(`SELECT ?mb ?omb ?oLabel ?dir ?start ?end WHERE {
      VALUES ?mb { ${need.map(i => `"${i}"`).join(' ')} }
      ?a wdt:P434 ?mb .
      OPTIONAL {
        { ?a p:P463 ?st . ?st ps:P463 ?o . BIND("forward" AS ?dir) } UNION
        { ?o p:P463 ?st . ?st ps:P463 ?a . BIND("backward" AS ?dir) } UNION
        { ?a p:P527 ?st . ?st ps:P527 ?o . BIND("backward" AS ?dir) } UNION
        { ?o p:P527 ?st . ?st ps:P527 ?a . BIND("forward" AS ?dir) }
        ?o wdt:P434 ?omb .
        OPTIONAL { ?st pq:P580 ?start } OPTIONAL { ?st pq:P582 ?end }
      }
      SERVICE wikibase:label { bd:serviceParam wikibase:language "de,en". }
    }`);
    need.forEach(id => wdCache.set(id, { found:false, rels:[] }));
    const seen = new Set();
    for(const b of rows){

    if(mbInfo) mbInfo.rels.forEach(r => { if(!rels.some(x => x.artist.id === r.artist.id)) rels.push({ ...r, src:'mb' }); });
    if(!(wd && wd.found) && !mbInfo){ const info = await artistInfo(id, 'high'); info.rels.forEach(r => rels.push({ ...r, src:'mb' })); }
    rels.forEach(r => {
      if(badEdges.has(id + '>' + r.artist.id) || have.has(r.artist.id)) return; have.add(r.artist.id);

function newHintState(starts, target){

  B.set(target.id, { next:null, via:null, name:target.name, cost:0 });

function buildPath(st, meet){

  while(st.B.get(cur).next){ const e = st.B.get(cur); right.push({ from:cur, fromName:e.name, to:e.next, toName:st.B.get(e.next).name, via:e.via }); cur = e.next; }

/* Beste-zuerst-Suche von beiden Seiten. Band-Links und häufige Partner sind billiger;

async function searchPath(st, opts, budget, onProgress, isStopped){
  for(const id of st.A.keys()) if(st.B.has(id)){ st.path = buildPath(st, id); return st.path; }
  let n = 0;
  while(n < budget && (st.qA.size || st.qB.size)){
    if(isStopped()) return null;
    await prefetchWd(st);
    const sideA = st.qA.size > 0 && (st.eA <= st.eB || !st.qB.size);
    const q = sideA ? st.qA : st.qB, mine = sideA ? st.A : st.B, other = sideA ? st.B : st.A;
    const id = popMin(q, mine); n++; st.expanded++; if(sideA) st.eA++; else st.eB++;
    const node = mine.get(id);
    onProgress(st, node.name);
    let nb;
    try{ nb = await neighbors(id, node.name, opts); }catch(e){ if(e.status === 404) continue; throw e; }
    for(const x of nb){
      const aid = x.artist.id; if(!aid) continue;
      const cost = node.cost + x.cost;
      const ex = mine.get(aid);
      if(ex){ if(q.has(aid)) ex.cost = Math.max(ex.cost - 0.08, 0.3); continue; }
      mine.set(aid, sideA ? { prev:id, via:x.via, name:x.artist.name, cost } : { next:id, via:x.via, name:x.artist.name, cost });
      if(other.has(aid)){ st.path = buildPath(st, aid); return st.path; }
      q.add(aid);
    }

const songByCache = new Map();

async function verifyPath(p, opts){
  for(let i = 0; i < p.length; i++){
    const e = p[i];
    if(e.via.type === 'band' && e.via.src === 'wd'){
      const [a, b] = await Promise.all([artistInfo(e.from, 'high'), artistInfo(e.to, 'high')]);
      const ra = a.rels.find(r => r.artist.id === e.to), rb = b.rels.find(r => r.artist.id === e.from);
      if(!ra && !rb){ badEdges.add(e.from + '>' + e.to); badEdges.add(e.to + '>' + e.from); return false; }
      e.via.text = ra ? relText(a, ra) : relText(b, rb); e.via.src = 'mb';
      e.via.code = ra ? (relCode(ra) | (ra.dir === 'backward' ? 16 : 0)) : (relCode(rb) | (rb.dir === 'backward' ? 0 : 16));
    }
    if(e.via.type === 'band' && e.via.toBase !== true && p[i + 1] && p[i + 1].via.type === 'band' && !(await hasSongBy(e.to))){
      badEdges.add(e.from + '>' + e.to); badEdges.add(e.to + '>' + e.from); return false;
    }
    if(e.via.type === 'feat' && !e.via.rec){
      const rec = await recWithBoth(e.from, e.to, e.via.title, opts);
      if(!rec){ badEdges.add('f:' + e.from + '>' + e.to); badEdges.add('f:' + e.to + '>' + e.from); return false; }

  if(overlaySeen.has(sig)) return;
  if(graph && !graphAdd(a.id, a.name, b.id, b.name, code)){ overlaySeen.add(sig); return; }

function loadGraph(){

    let g = null;

      if(r.ok){ const j = await r.json(); if(j && j.v === 2 && j.src === 'musicbrainz') g = j; }
    }catch(e){}

    const n = g.ids.length, deg = new Uint32Array(n);

    const off = new Uint32Array(n + 1); for(let i = 0; i < n; i++) off[i + 1] = off[i] + deg[i];

/* Kürzester Weg (Breitensuche von den Ziel-Einstiegen aus, Bandbeziehungen zuerst).

function graphPath(starts, targets, opts){

    if(opts.noEdge && opts.noEdge.has(x * 4194304 + y)) return false;
    if(!opts.pure && badEdges.has(((c & 7) === 2 ? 'f:' : '') + g.ids[y] + '>' + g.ids[x])) return false;
    seen[y] = 1; next[y] = x; nk[y] = c; nextF.push(y);

          const c = g.kind[k], isBand = (c & 7) !== 2;
          if((pass === 1) !== isBand || (isBand && !opts.bandLinks)) continue;
          if(visit(x, g.nb[k], c, nextF)){ hit = g.nb[k]; break; }

          if(visit(x, y, c, nextF)){ hit = y; break; }

async function networkPath(starts, target, ho, say, isStopped){
  await loadGraph();
  const inG = id => graph.idx.has(id);
  const pre = new Map(), post = new Map();
  let S = starts.filter(a => inG(a.id)), T = inG(target.id) ? [target] : [];
  if(!S.length){
    say('Die Startband fehlt im Musiknetz, ich hole ihre direkten Verbindungen …');
    for(const s0 of starts) for(const x of await neighbors(s0.id, s0.name, ho))
      if(inG(x.artist.id) && !pre.has(x.artist.id)) pre.set(x.artist.id, { from:s0.id, fromName:s0.name, to:x.artist.id, toName:x.artist.name, via:x.via });
    S = [...pre.keys()].map(id => ({ id }));
  }
  if(!T.length){
    say('Die Zielband fehlt im Musiknetz, ich hole ihre direkten Verbindungen …');
    for(const x of await neighbors(target.id, target.name, ho))
      if(inG(x.artist.id) && !post.has(x.artist.id)) post.set(x.artist.id, flipEdge({ from:target.id, fromName:target.name, to:x.artist.id, toName:x.artist.name, via:x.via }));
    T = [...post.keys()].map(id => ({ id }));
  }
  for(let tries = 0; tries < 15 && !isStopped(); tries++){
    for(const [k, e] of pre) if(badEdges.has(edgeKey(e))) pre.delete(k);
    for(const [k, e] of post) if(badEdges.has(edgeKey(e))) post.delete(k);
    if(pre.size) S = S.filter(a => pre.has(a.id));
    if(post.size) T = T.filter(a => post.has(a.id));
    const gp = graphPath(S, T, ho);
    if(!gp) return null;
    const full = [...(pre.size ? [pre.get(gp.s)] : []), ...gp.edges, ...(post.size ? [post.get(gp.t)] : [])];
    if(!full.length) return null;
    say(`Weg mit ${full.length} Schritt${full.length === 1 ? '' : 'en'} gefunden, hole die Songs aus MusicBrainz …`, tries);
    if(await verifyPath(full, ho)){ recordPath(full); return full; }

}

function anchors(){

  if(game.steps.length) return game.steps[game.steps.length - 1].rec.artists;
  return game.free ? [] : [game.ch.start];
}
const firstWithId = list => (list || []).find(a => a.id) || null;

/* Freie Kette abschließen: Start- und Zielband aus erstem und letztem Song wählen */
function openFinishSheet(){
  if(!game || game.steps.length < 2){ toast('Mindestens zwei Songs, dann kannst du abschließen'); return; }
  const first = game.steps[0].rec.artists.filter(a => a.id), last = game.steps[game.steps.length - 1].rec.artists.filter(a => a.id);
  if(!first.length || !last.length){ toast('Erster oder letzter Song hat keinen Künstler aus MusicBrainz'); return; }
  const opts = (list, name) => list.map((a, i) => `<label class="check"><input type="radio" name="${name}" value="${i}" ${i === 0 ? 'checked' : ''}> ${esc(a.name)}</label>`).join('');
  sheet(`<h2>Kette abschließen</h2>
    <p class="muted small">Welche Bands sind Start und Ziel deiner Kette?</p>
    <span class="eyebrow">Startband (erster Song)</span>${opts(first, 'fs')}
    <span class="eyebrow">Zielband (letzter Song)</span>${opts(last, 'ft')}
    <div class="row"><button class="btn ghost" data-close>Weiterbauen</button><button class="btn primary" id="finSave">Abschließen</button></div>`);
  $('#finSave').onclick = () => {
    const s = first[+document.querySelector('input[name=fs]:checked').value];
    const t = last[+document.querySelector('input[name=ft]:checked').value];
    if(s.id === t.id){ toast('Start und Ziel müssen verschiedene Bands sein'); return; }
    game.ch = { start:{ id:s.id, name:s.name, type:'', country:'', dis:'' }, target:{ id:t.id, name:t.name, type:'', country:'', dis:'' } };
    game.steps[0].link = { type:'start', via:[{ id:s.id, name:s.name }] };
    game.won = true; game.finishedAt = Date.now(); LS.set('game', game); saveHistory();
    closeSheet(); view = 'result'; render();
  };
}
function addStep(rec, link){
  game.steps.push({ rec, link });
  if(isWin(rec)){ game.won = true; game.finishedAt = Date.now(); saveHistory(); view = 'result'; }
  LS.set('game', game);
  if(!game.won){ search.chip = firstWithId(rec.artists); search.q = ''; render(); if(!batchRunning) runSearch(true); prefetchAnchors(); }
  else render();
}
function isDuplicate(rec){
  return game.steps.some(st => (rec.id && st.rec.id === rec.id) || (rec.spotifyId && st.rec.spotifyId === rec.spotifyId));
}
/* Gibt true zurück, wenn der Song in der Kette gelandet ist */
async function tryAdd(rec, rowEl){
  if(adding) return false;
  const s = settings();
  if(s.maxSongs && game.steps.length >= s.maxSongs){ toast(`Limit von ${s.maxSongs} Songs erreicht. Nimm einen Schritt zurück.`); return false; }
  if(isDuplicate(rec)){ toast('Der Song ist schon in deiner Kette'); return false; }
  if(rec.remix){ toast('Remixe zählen nicht. Nimm die Originalversion.'); return false; }
  if(game.free && !game.steps.length){
    if(!rec.artists.some(a => a.id)){ toast('Der erste Song braucht einen Künstler aus MusicBrainz'); return false; }
    addStep(rec, { type:'first' }); return true;
  }
  adding = true;
  const busy = $('#addBusy'); if(busy){ busy.hidden = false; busy.querySelector('span:last-child').textContent = 'Prüfe Verbindung in MusicBrainz …'; }
  try{
    const link = await findLink(anchors(), rec.artists, s);
    if(link){ adding = false; addStep(rec, link); return true; }
    if(rowEl){ rowEl.classList.remove('shake'); void rowEl.offsetWidth; rowEl.classList.add('shake'); }
    openNoLinkSheet(rec);
    return false;
  }catch(e){ handleErr(e); return false; }
  finally{ adding = false; const b = $('#addBusy'); if(b) b.hidden = true; }
}

/* Spotify-Links einfügen: einzeln oder als ganze Liste */
function setLinkBusy(t){
  linkBusyText = t || '';
  const el = $('#linkBusy'); if(!el) return;
  el.hidden = !linkBusyText; el.querySelector('span:last-child').textContent = linkBusyText;
}
async function addFromLinks(text){
  if(batchRunning || !game || game.won) return;
  const ids = parseSpotifyIds(text);
  const shorts = text.match(/https?:\/\/spotify\.link\/[A-Za-z0-9]+/g) || [];
  batchRunning = true;
  try{
    for(const s of shorts){
      setLinkBusy('Kurzlink wird aufgelöst …');
      const od = await odesli(s);
      if(od && od.spotifyId){ if(!ids.includes(od.spotifyId)) ids.push(od.spotifyId); }
      else toast('Kurzlink ließ sich nicht auflösen. In Spotify „Link kopieren“ nutzen.');
    }
    if(!ids.length){
      toast(/spotify\.com\/(?:intl-[a-z-]+\/)?(playlist|album)/.test(text) ? 'Playlists und Alben gehen nicht. Bitte einzelne Song-Links einfügen.' : 'Kein Spotify-Song-Link gefunden');
      return;
    }
    let added = 0;
    for(let i = 0; i < ids.length; i++){
      if(!game || game.won) break;
      const label = ids.length > 1 ? `Song ${i + 1} von ${ids.length}: ` : '';
      setLinkBusy(label + 'Spotify-Link wird erkannt …');
      let rec;
      try{ rec = await resolveSpotify(ids[i], { anchors:anchors(), start:game.ch.start, target:game.ch.target }); }
      catch(e){ handleErr(e); break; }
      if(!rec){ if(i < ids.length - 1) toast('Abgebrochen. Restliche Links wurden nicht übernommen.'); break; }
      setLinkBusy(label + 'Prüfe Verbindung …');
      const ok = await tryAdd(rec);
      if(!ok){ if(i < ids.length - 1) toast(`Bei Song ${i + 1} angehalten. Die restlichen Links bleiben im Feld.`); linkInput = ids.slice(i + 1).map(spTrackUrl).join('\n'); break; }
      added++;
      if(i === ids.length - 1) linkInput = '';
    }
    if(added && !(game && game.won)) toast(added === 1 ? 'Song hinzugefügt' : `${added} Songs hinzugefügt`);
  }finally{
    batchRunning = false; setLinkBusy('');
    const ta = $('#spIn'); if(ta) ta.value = linkInput;
    if(view === 'game' && game && !game.won) runSearch(true);
  }
}
function undo(){
  if(!game || !game.steps.length) return;
  game.steps.pop(); game.won = false; game.finishedAt = null;
  if(game.free){ game.ch = { start:null, target:null }; if(game.steps[0]) game.steps[0].link = { type:'first' }; }
  LS.set('game', game);
  view = 'game'; search.chip = firstWithId(anchors()); search.q = '';
  render(); runSearch(true);
}
function guardRunning(fn){
  if(game && !game.won && game.steps.length){

/* Prüf-Code: Start, Ziel und alle Aufnahmen als MusicBrainz-IDs; ! markiert unbelegte Glieder */
/* Glied: [MusicBrainz-Aufnahme]~[Spotify-ID]~[Künstler-IDs, nur ohne Aufnahme] und ! für unbelegt */
function stepToken(s){
  const r = s.rec; let t = r.id || '';
  if(r.spotifyId) t += '~' + r.spotifyId;
  if(!r.id) t += '~' + r.artists.filter(a => a.id).map(a => a.id).join(',');
  return t + (s.link.type === 'claim' ? '!' : '');
}
function parseToken(p){
  const claim = p.endsWith('!'); const [mbid = '', sp = '', arts = ''] = p.replace(/!$/, '').split('~');
  return { mbid, sp, arts:arts ? arts.split(',') : [], claim };
}
function chainCode(g){ return [g.ch.start.id, g.ch.target.id, ...g.steps.map(stepToken)].join('.'); }
const MBID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
function tokenValid(t){ return (t.mbid ? MBID.test(t.mbid) : !!t.sp) && (!t.sp || SPID.test(t.sp)) && t.arts.every(a => MBID.test(a)); }

const parCache = new Map();
function draftPar(){
  if(!draft.start || !draft.target || !graph) return undefined;
  const k = draft.start.id + '>' + draft.target.id;
  if(!parCache.has(k)) parCache.set(k, parFor(draft.start, draft.target));

/* Schritte (Verbindungen) von einem Künstler zu allen anderen im Musiknetz */
function hopsFrom(src){
  const g = graph, n = g.baseN, dist = new Uint8Array(n).fill(255);
  let frontier = [src]; dist[src] = 0;
  for(let d = 1; d < 16 && frontier.length; d++){
    const nf = [];
    for(const x of frontier) for(let k = g.off[x]; k < g.off[x + 1]; k++){ const y = g.nb[k]; if(y < n && dist[y] === 255){ dist[y] = d; nf.push(y); } }
    frontier = nf;
  }
  return dist;
}
const LATIN = /^[\u0020-\u024F\u2010-\u2019'’&.!?]+$/;
/* Lange Ketten: bekannter Start, Ziel ist der bekannteste Künstler in passender Entfernung */
function farPairFor(level, pool){
  const g = graph;
  for(let t = 0; t < 24; t++){
    const a = pool[Math.floor(Math.random() * pool.length)], ai = g.idx.get(a.id); if(ai === undefined) continue;
    const dist = hopsFrom(ai), cands = [];
    for(let i = 0; i < g.baseN; i++){
      const d = dist[i]; if(d === 255 || d < level.lo || d > level.lo + 3) continue;
      const nm = g.names[i] || ''; if(!LATIN.test(nm) || /various artists|unknown|anonymous|\[/i.test(nm)) continue;
      cands.push([i, g.off[i + 1] - g.off[i]]);
    }
    cands.sort((x, y) => y[1] - x[1]);
    const top = cands.slice(0, 60);
    for(let k = top.length - 1; k > 0; k--){ const j = Math.floor(Math.random() * (k + 1)); [top[k], top[j]] = [top[j], top[k]]; }
    for(const [i] of top.slice(0, 40)){
      const b = { id:g.ids[i], name:g.names[i], type:'', country:'', dis:'' };
      const par = parFor(a, b);
      if(par && par >= level.lo && par <= level.hi){
        if(Math.random() < 0.5){ const back = parFor(b, a); if(back && back >= level.lo && back <= level.hi) return { a:b, b:a, par:back }; }
        return { a, b, par };
      }
    }
  }
  return null;
}
/* Zufälliges Paar bekannter Bands mit passender Schwierigkeit */
function randomPairFor(level){
  const names = [...new Set([...DAILY_POOL, ...POOL.map(x => x[0])])];
  const pool = names.map(graphByName).filter(Boolean);
  if(level.lo >= 6){ const far = farPairFor(level, pool); if(far) return far; }
  let best = null;
  for(let t = 0; t < 3000; t++){
    const a = pool[Math.floor(Math.random() * pool.length)], b = pool[Math.floor(Math.random() * pool.length)];
    if(!a || !b || a.id === b.id) continue;
    const par = parFor(a, b); if(!par) continue;
    if(par >= level.lo && par <= level.hi) return { a, b, par };
    if(!best || Math.abs(par - level.lo) < Math.abs(best.par - level.lo)) best = { a, b, par };
  }
  return best;
}

const pad2 = n => String(n).padStart(2, '0');
function dayKey(d = new Date()){ return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function dayDate(k){ const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(k, n){ const d = dayDate(k); d.setDate(d.getDate() + n); return dayKey(d); }
function fmtDay(k){ const [y, m, d] = k.split('-'); return `${d}.${m}.${y}`; }
function weekOf(k){ const d = dayDate(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dayKey(d); }
const WEEKDAY = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];

function profile(){
  const p = Object.assign({ points:0, games:0, daily:{}, streak:{}, badges:{}, atlas:{}, packs:{}, duelsWon:0 }, LS.get('profile', {}));
  p.streak = Object.assign({ count:0, best:0, last:null, joker:null }, p.streak);
  return p;
}
function saveProfile(p){ LS.set('profile', p); }
function rankOf(points){
  let i = 0; while(i + 1 < RANKS.length && points >= RANKS[i + 1][0]) i++;
  const next = RANKS[i + 1];
  return { name:RANKS[i][1], at:RANKS[i][0], next:next ? next[1] : null, nextAt:next ? next[0] : null };
}
/* Aktuelle Serie: gilt, solange gestern gespielt wurde; ein verpasster Tag pro Woche wird per Joker überbrückt */
function streakNow(p){
  const s = p.streak, t = dayKey();
  if(!s.last) return 0;
  if(s.last === t || s.last === addDays(t, -1)) return s.count;
  if(s.last === addDays(t, -2) && s.joker !== weekOf(t)) return s.count;
  return 0;
}
function bumpStreak(p, k){
  const s = p.streak;
  if(s.last === k) return;
  if(s.last === addDays(k, -1)) s.count++;
  else if(s.last === addDays(k, -2) && s.joker !== weekOf(k)){ s.count++; s.joker = weekOf(k); }
  else s.count = 1;
  s.last = k; s.best = Math.max(s.best, s.count);
}

/* Künstler im Musiknetz nach Namen; bei gleichen Namen der mit den meisten Verbindungen */
let nameIdx = null, nameIdxFor = null;
function graphByName(name){
  if(!graph || !graph.baseN) return null;
  if(nameIdxFor !== graph){
    nameIdx = new Map(); nameIdxFor = graph;
    for(let i = 0; i < graph.baseN; i++){
      const k = (graph.names[i] || '').toLowerCase(), c = nameIdx.get(k);
      if(c === undefined || graph.off[i + 1] - graph.off[i] > graph.off[c + 1] - graph.off[c]) nameIdx.set(k, i);
    }
  }
  const i = nameIdx.get(name.toLowerCase());
  return i === undefined ? null : { id:graph.ids[i], name:graph.names[i], type:'', country:'', dis:'' };
}
/* Par = kürzester Weg im Musiknetz (ohne Geräte-Ergänzungen, damit es für alle gleich ist);
   Band-Link plus anschließender gemeinsamer Song zählen als ein Song */
function parFor(a, b){
  if(!graph || a.id === b.id) return null;
  const gp = graphPath([a], [b], { bandLinks:true, pure:true });
  if(!gp) return null;
  let par = 0; const e = gp.edges;
  for(let i = 0; i < e.length; i++){ par++; if(e[i].via.type === 'band' && e[i + 1] && e[i + 1].via.type === 'feat') i++; }
  return Math.max(1, par);
}
function seeded(seed){
  let h = 2166136261; for(const ch of seed) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => { h = (h + 0x6D2B79F5) | 0; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
/* Tageskette: aus Datum und Musiknetz berechnet, daher auf allen Geräten gleich */
async function dailyFor(k){
  const cache = LS.get('dailies', {});
  if(cache[k]) return cache[k];
  await loadGraph();
  if(!graph.baseN) return null;
  const r = seeded('bandkette-' + k), [lo, hi] = PAR_RANGE[dayDate(k).getDay()];
  const pool = DAILY_POOL.map(graphByName).filter(Boolean);
  let pick = null, fallback = null;
  for(let t = 0; t < 300 && !pick; t++){
    const a = pool[Math.floor(r() * pool.length)], b = pool[Math.floor(r() * pool.length)];
    if(a.id === b.id) continue;
    const par = parFor(a, b); if(!par) continue;
    if(!fallback && par >= 2) fallback = { s:a, t:b, par };
    if(par >= lo && par <= hi) pick = { s:a, t:b, par };
  }
  const d = pick || fallback; if(!d) return null;

function parWord(n, par){
  const d = n - par;

}
function scoreGame(g){
  if(g.solved) return { total:0, counted:false, lines:[['Von der App gelöst', 0]] };
  if(g.timeUp) return { total:0, counted:false, lines:[['Zeit abgelaufen', 0]] };
  const L = [], n = g.steps.length;
  L.push(['Kette gelöst', g.free ? 5 : 10]);
  if(g.par){ const d = g.par - n; if(d > 0) L.push([`${d} unter Par`, 5 + 5 * d]); else if(d === 0) L.push(['Par getroffen', 5]); else L.push([`${-d} über Par`, 2 * d]); }
  const lv = levelFor(g.par); if(lv && lv.bonus) L.push([`Schwierigkeit ${lv.name}`, lv.bonus]);
  if(g.kind === 'daily') L.push(['Tageskette', 5]);
  if(g.timeLimit) L.push(['Gegen die Uhr', 5]);
  if(g.hints) L.push([`${g.hints} Tipp${g.hints === 1 ? '' : 's'}`, -2 * g.hints]);
  const claims = g.steps.filter(x => x.link.type === 'claim').length;
  if(claims) L.push([`${claims} unbelegt`, -3 * claims]);
  const total = Math.max(1, L.reduce((s, x) => s + x[1], 0));
  if(g.kind === 'daily' && g.ranked === false) return { total:0, counted:false, lines:[...L, ['Tageskette schon gewertet', 0]] };
  return { total, counted:true, lines:L };
}
/* Wird einmal pro gelöster Kette aufgerufen: Punkte, Serie, Abzeichen, Atlas, Pakete, Duell, Party */
function award(){
  if(game.award) return game.award;
  const sc = scoreGame(game), n = game.steps.length, ms = game.finishedAt - game.startedAt;
  const a = { score:sc, newBadges:[], duel:null, rankUp:null };
  if(game.duel && !game.solved && !game.timeUp){
    const secs = Math.round(ms / 1000);
    a.duel = n < game.duel.songs || (n === game.duel.songs && secs < game.duel.secs) ? 'win' : n === game.duel.songs && secs === game.duel.secs ? 'tie' : 'lose';
  }
  if(game.kind === 'party'){
    const party = LS.get('party', null);
    if(party && party.teams[game.team]){
      party.teams[game.team].res = { n, ms, hints:game.hints || 0, points:sc.total, solved:!!game.solved, code:chainCode(game) };
      party.cur = game.team + 1; LS.set('party', party);
    }
    game.award = a; LS.set('game', game); return a;
  }
  const p = profile(), before = rankOf(p.points).name, own = !game.solved && !game.timeUp;
  if(sc.counted) p.points += sc.total;
  if(!game.solved) p.games++;
  if(game.kind === 'daily' && game.ranked !== false){
    p.daily[game.day] = { n, par:game.par, hints:game.hints || 0, ms, solved:!!game.solved, share:dailyShareText() };
    if(own && game.day === dayKey()) bumpStreak(p, game.day);
  }
  if(own){
    game.steps.forEach(st => st.rec.artists.forEach(x => { if(x.id){ const e = p.atlas[x.id]; p.atlas[x.id] = [x.name, (e ? e[1] : 0) + 1]; } }));
    if(game.kind === 'pack'){ const l = p.packs[game.pack] || []; if(!l.includes(game.idx)) l.push(game.idx); p.packs[game.pack] = l; }
    if(a.duel === 'win') p.duelsWon++;
  }
  const earn = id => { if(!p.badges[id]){ p.badges[id] = dayKey(); a.newBadges.push(id); } };
  if(own){
    earn('erste');
    if(!game.free && !game.hints) earn('ohnetipp');
    if(game.par && n === game.par) earn('par');
    if(game.par >= 4) earn('schwer');
    if(game.par >= 5) earn('profi');
    if(game.par >= 6) earn('legende');
    if(game.par >= 7) earn('marathon');
    if(game.par && n < game.par) earn('unterpar');
    if(game.steps.filter(x => x.link.type === 'band' || x.link.type === 'colleague').length >= 3) earn('bandwechsel');
    if(ms < 120000 && n >= 2) earn('blitz');
    if(game.timeLimit) earn('uhr');
    if(a.duel === 'win') earn('duell');
    if(p.streak.count >= 7) earn('serie7');
    if(p.streak.count >= 30) earn('serie30');
    if(Object.values(p.daily).filter(d => !d.solved).length >= 10) earn('tage10');
    if(Object.keys(p.atlas).length >= 100) earn('atlas100');
    PACKS.forEach(pk => { if((p.packs[pk.id] || []).length >= pk.list.length) earn('paket-' + pk.id); });
  }
  const after = rankOf(p.points).name;
  if(after !== before) a.rankUp = { from:before, to:after };
  saveProfile(p);
  game.award = a; LS.set('game', game);
  a.newBadges.forEach((id, i) => setTimeout(() => toast('Neues Abzeichen: ' + BADGES.find(b => b[0] === id)[1]), 600 + i * 3200));
  return a;
}

/* ---------- Abgleich mit Apple Music ---------- */
const amNorm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/\s*[\(\[][^\)\]]*(feat|ft\.|with|remaster|version|edit|mono|stereo|live|deluxe)[^\)\]]*[\)\]]/g, '')
  .replace(/\s+-\s+.*(remaster|version|edit|mix|live).*$/, '').replace(/&/g, 'and').replace(/[^a-z0-9]+/g, ' ').trim();
function amScore(rec, t){
  const want = amNorm(rec.title), got = amNorm(t.trackName);
  let s = 0;
  if(want && got === want) s += 6; else if(want && (got.startsWith(want) || want.startsWith(got))) s += 3; else if(want && got.includes(want)) s += 1; else return -1;
  const who = amNorm(t.artistName);
  const names = (rec.artists || []).map(a => amNorm(a.name)).filter(Boolean);
  const hits = names.filter(n => who.includes(n) || n.includes(who)).length;
  if(!hits) return -1;
  s += 2 + hits;
  if(/remix|live|karaoke|instrumental/i.test(t.trackName) && !/remix|live|karaoke|instrumental/i.test(rec.title)) s -= 4;
  if(t.previewUrl) s += 1;
  return s;
}
let jsonpN = 0;
function jsonp(url){
  return new Promise((res, rej) => {
    const cb = '__bkcb' + (++jsonpN), s = document.createElement('script');
    const done = () => { delete window[cb]; s.remove(); clearTimeout(to); };
    const to = setTimeout(() => { done(); rej(new Error('keine Antwort')); }, 9000);
    window[cb] = j => { done(); res(j); };
    s.onerror = () => { done(); rej(new Error('nicht erreichbar')); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}
/* Suchquellen der Reihe nach: Apple-Music-API (mit Token), öffentliche iTunes-Suche, Deezer-Hörproben als Reserve */
function amBest(rec, list){
  let best = null, bs = 0;
  for(const t of list){ const sc = amScore(rec, t); if(sc > bs){ bs = sc; best = t; } }
  return best;
}
function amTerms(rec){
  const artist = rec.artists && rec.artists[0] ? rec.artists[0].name : (rec.credit || '');
  const t = amNorm(rec.title);
  return [(t + ' ' + artist).trim(), t].filter((x, i, a) => x && a.indexOf(x) === i);
}
async function srcAppleApi(rec){
  const tok = await amToken(); if(!tok) return undefined;
  for(const term of amTerms(rec)){
    const r = await fetch(`https://api.music.apple.com/v1/catalog/${amStorefront()}/search?types=songs&limit=20&term=` + encodeURIComponent(term), { headers:{ Authorization:'Bearer ' + tok } });
    if(r.status === 401 || r.status === 403) throw new Error('Apple-Music-Token wird nicht akzeptiert');
    if(!r.ok) throw new Error('Apple Music antwortet mit Fehler ' + r.status);
    const j = await r.json();
    const list = ((j.results && j.results.songs && j.results.songs.data) || []).map(d => ({ id:d.id, trackName:d.attributes.name, artistName:d.attributes.artistName,
      previewUrl:d.attributes.previews && d.attributes.previews[0] ? d.attributes.previews[0].url : null, url:d.attributes.url,
      art:d.attributes.artwork ? d.attributes.artwork.url.replace('{w}', '200').replace('{h}', '200') : '', dur:d.attributes.durationInMillis || 0 }));
    const b = amBest(rec, list);
    if(b) return { src:'apple', id:String(b.id), title:b.trackName, artist:b.artistName, preview:b.previewUrl, url:b.url, art:b.art, dur:b.dur };
  }
  return null;
}

    const b = amBest(rec, j.results || []);
    if(b) return { src:'apple', id:String(b.trackId), title:b.trackName, artist:b.artistName, preview:b.previewUrl || null,
      url:(b.trackViewUrl || '').replace(/[?&]uo=\d+/, ''), art:(b.artworkUrl100 || '').replace('100x100bb', '200x200bb'), dur:b.trackTimeMillis || 0 };

    if(j && j.error) throw new Error('Deezer: ' + (j.error.message || 'Fehler'));
    const list = ((j && j.data) || []).map(d => ({ id:d.id, trackName:d.title, artistName:d.artist ? d.artist.name : '', previewUrl:d.preview || null, url:d.link,
      art:d.album ? d.album.cover_medium : '', dur:(d.duration || 0) * 1000 }));

function plHalt(except){

async function playList(recs, start = 0){

    plHalt('mk'); spShow(false); pl.cur = 'mk';
    pl.busy = true; plDraw();
    const matches = await Promise.all(recs.map(r => amFind(r, { apple:true }).catch(() => null)));
    const ids = [], map = [];
    matches.forEach((m, i) => { if(m){ map[ids.length] = i; ids.push(m.id); } });
    pl.map = map; pl.matches = matches; pl.busy = false;

async function plGo(i){

    const qi = pl.map.indexOf(i);

    pl.match = pl.matches[i];
    try{ await mk.changeToMediaAtIndex(qi); await mk.play(); }catch(e){ pl.msg = 'Apple Music: ' + (e.message || 'Fehler'); }
    plDraw(); return;
  }
  const rec = pl.queue[i];
  pl.match = null; pl.t = 0; pl.dur = 0; pl.busy = true; pl.playing = false; plDraw();
  // Spotify zuerst
  if(playVia() === 'spotify'){
    let sid = null; try{ sid = await spFind(rec); }catch(e){}
    if(pl.queue[pl.idx] !== rec) return;
    if(sid){
      plHalt('sp'); pl.cur = 'sp'; pl.spEnded = false; pl.busy = false;
      pl.match = { src:'spotify', title:rec.title, artist:rec.credit, url:spTrackUrl(sid), sid };
      spShow(true); plDraw();

        const fresh = !spCtl, c = await spController('spotify:track:' + sid);
        if(pl.queue[pl.idx] !== rec) return;
        if(!fresh) c.loadUri('spotify:track:' + sid);
        setTimeout(() => { try{ c.play(); }catch(e){} }, fresh ? 300 : 150);
        setTimeout(() => { if(pl.cur === 'sp' && pl.queue[pl.idx] === rec && !pl.playing){ pl.note = 'Läuft nichts? Einmal ▶ im Spotify-Player tippen.'; plDraw(); } }, 2500);
        plMedia();
      }catch(e){ pl.msg = e.message; plDraw(); }
      return;
    }
    pl.note = 'Nicht bei Spotify gefunden, darum Hörprobe als Ersatz.';
  }
  // Ersatz: Hörprobe von Apple Music oder Deezer
  plHalt('audio'); spShow(false); pl.cur = 'audio';
  const a = audioEl();
  let m = null, err = null; try{ m = await amFind(rec); }catch(e){ err = e.message; }
  if(pl.queue[pl.idx] !== rec) return;
  pl.busy = false; pl.match = m;

    pl.msg = err ? err : !m ? 'Song nicht gefunden' : settings().amPreview === false ? 'Hörproben sind ausgeschaltet. Öffne den Song über den Link.' : 'Keine Hörprobe verfügbar';

  }

  try{ await a.play(); }catch(e){ pl.msg = 'Zum Abspielen auf ▶ tippen'; }
  plMedia(); plDraw();
}

function linkHtml(link, status){
  let cls = 'feat', txt = '';

  else if(link.type === 'band'){ cls = 'band'; txt = `<a href="https://musicbrainz.org/artist/${esc(link.a.id)}/relationships" target="_blank" rel="noopener">${esc(link.text)}</a>`; }
  else if(link.type === 'colleague'){ cls = 'band'; txt = `<a href="https://musicbrainz.org/artist/${esc(link.band.id)}/relationships" target="_blank" rel="noopener">${esc(link.text)}</a>`; }
  else if(link.type === 'claim'){ cls = 'claim'; txt = 'nicht in MusicBrainz belegt, von der Gruppe bestätigt'; }
  else if(link.type === 'bad'){ cls = 'bad'; txt = esc(link.text); }

function chainHtml(g, withTarget){
  if(!g.ch.start){

  search.loading = true; updateResults();
  try{
    const { items, total } = await searchRecordings(query, search.offset);
    if(seq !== search.seq) return;
    const key = r => r.title.toLowerCase().replace(/\s*[\(\[].*?(live|remaster|version|edit|mix|demo|acoustic).*?[\)\]]/gi, '').trim() + '|' + r.artists.map(a => a.id).sort().join(',');
    const seen = new Set(search.items.map(key));
    const fresh = items.filter(r => !r.video && !r.remix && !seen.has(key(r)) && (seen.add(key(r)), true));
    if(search.chip && !search.q.trim()) fresh.sort((a, b) => b.artists.length - a.artists.length);
    search.items = search.items.concat(fresh); search.total = total; search.offset += 100;
  }catch(e){ handleErr(e); }
  if(seq === search.seq){ search.loading = false; updateResults(); }
}
function updateResults(){
  const r = $('#results'); if(!r) return;
  r.innerHTML = resultsHtml(); bindResults();
  const m = $('#btnMore'); if(m) m.hidden = !moreVisible();
}
function tick(){
  if(!game) return;
  const c = $('#clock'), el = Date.now() - game.startedAt;
  if(game.timeLimit && !game.timeUp){
    const left = game.timeLimit - el;
    if(left <= 0){ game.timeUp = true; LS.set('game', game); toast('Zeit abgelaufen. Du kannst weiterspielen, die Kette bringt aber 0 Punkte.'); render(); return; }
    if(c) c.textContent = fmtTime(left);

  }

}

async function pickSongBy(a){

  const r = await mb('recording?limit=25&query=' + encodeURIComponent('arid:' + a.id), 'high');
  const list = dedupeRecs((r.recordings || []).map(recPick)).filter(x => !used.has(x.id) && x.artists.some(y => y.id === a.id));
  return list.find(x => x.artists.length === 1) || list[0] || null;
}
async function applyPath(p, onStep){
  batchRunning = true; let added = 0;
  try{
    for(let i = 0; i < p.length; i++){
      const e = p[i];
      if(!game || game.won) break;
      onStep && onStep(i, p.length, e.toName);
      const rec = e.via.type === 'feat' ? { ...e.via.rec } : await pickSongBy({ id:e.to, name:e.toName });
      if(!rec){ toast(`Kein Song von ${e.toName} gefunden. Ab hier bitte selbst weiterbauen.`); break; }
      if(!(await tryAdd(rec))) break;
      added++;
    }
  }finally{ batchRunning = false; }
  if(game && !game.won && view === 'game'){ render(); runSearch(true); }
  return added;
}

/* Liste direkt verbundener Künstler; gemeinsame Songs aus Wikidata werden beim Antippen in MusicBrainz belegt */
async function neighborList(el, starts, max, counts){

/* ---------- Alternative Wege ---------- */
function songCount(edges){
  let n = 0;
  for(let i = 0; i < edges.length; i++){ n++; if(edges[i].via.type === 'band' && edges[i + 1] && edges[i + 1].via.type === 'feat') i++; }
  return n;
}
/* Erst der kürzeste Weg, dann Wege, die keinen Zwischenkünstler der bisherigen Wege mehr benutzen.
   So unterscheiden sich die Vorschläge wirklich und sind nicht fünfmal fast dieselbe Route. */
async function altPaths(starts, target, k = 5, maxExtra = 3){
  await loadGraph();
  const S = starts.filter(a => a.id && graph.idx.has(a.id));
  if(!S.length || !graph.idx.has(target.id)) return [];
  const opts = { bandLinks:settings().bandLinks, blocked:new Set(), noEdge:new Set() };
  const out = [], seen = new Set();
  for(let t = 0; t < k * 3 && out.length < k; t++){
    const gp = graphPath(S, [target], opts);
    if(!gp || !gp.edges.length) break;
    const mids = gp.edges.slice(0, -1).map(e => e.to), key = gp.edges.map(e => e.from).join('>');
    const songs = songCount(gp.edges);
    if(out.length && songs > out[0].songs + maxExtra) break;
    if(!seen.has(key)){ seen.add(key); out.push({ edges:gp.edges, songs }); }
    if(mids.length) mids.forEach(id => opts.blocked.add(graph.idx.get(id)));
    else { const a = graph.idx.get(gp.edges[0].from), b = graph.idx.get(target.id); opts.noEdge.add(b * 4194304 + a); opts.noEdge.add(a * 4194304 + b); }
  }
  /* Zu wenige Wege: zweite Runde, die jeweils nur einen Zwischenkünstler eines gefundenen Wegs sperrt */
  for(let r = 0; r < out.length && out.length < k; r++){
    for(const e of out[r].edges.slice(0, -1)){
      if(out.length >= k) break;
      const gp = graphPath(S, [target], { bandLinks:opts.bandLinks, blocked:new Set([graph.idx.get(e.to)]) });
      if(!gp || !gp.edges.length) continue;
      const key = gp.edges.map(x => x.from).join('>'), songs = songCount(gp.edges);
      if(!seen.has(key) && songs <= out[0].songs + maxExtra){ seen.add(key); out.push({ edges:gp.edges, songs }); }
    }
  }
  return out.sort((x, y) => x.songs - y.songs);
}
function pathSteps(edges){
  const st = [];
  for(let i = 0; i < edges.length; i++){
    const e = edges[i], nx = edges[i + 1];
    if(e.via.type === 'band' && nx && nx.via.type === 'feat'){ st.push({ band:e, feat:nx }); i++; }
    else st.push(e.via.type === 'band' ? { band:e } : { feat:e });
  }
  return st;
}
function altItemHtml(p, i, startName){
  const names = [startName, ...p.edges.map(e => e.toName)];
  const steps = pathSteps(p.edges).map(st => {
    const song = st.feat && st.feat.via.rec ? `<a href="${spotifyUrl(st.feat.via.rec)}" target="_blank" rel="noopener">${esc(st.feat.via.rec.title)}</a> – ${esc(st.feat.via.rec.credit)}` : null;
    if(st.band && st.feat) return `<li>${esc(st.band.via.text)}, dann ${song || 'ein Song mit ' + esc(st.feat.fromName) + ' und ' + esc(st.feat.toName)}</li>`;
    if(st.band) return `<li>${esc(st.band.via.text)}, dann ein Song von ${esc(st.band.toName)}</li>`;
    return `<li>${song || 'ein Song mit ' + esc(st.feat.fromName) + ' und ' + esc(st.feat.toName)}</li>`;
  }).join('');
  return `<div class="alt" data-alt="${i}"><div class="rankrow"><b>Weg ${i + 1}</b><span class="tag ${i === 0 ? 'ok' : ''}">${p.songs} Song${p.songs === 1 ? '' : 's'}</span></div>
    <div class="altroute">${names.map(esc).join(' <span class="arrow">→</span> ')}</div>
    <ol class="altsteps">${steps}</ol>
    ${p.loaded ? '' : `<button class="btn ghost" data-altload="${i}" style="min-height:38px;padding:8px 12px">Songs anzeigen</button>`}</div>`;
}
/* Füllt eine Liste mit alternativen Wegen; "Songs anzeigen" holt die Aufnahmen aus MusicBrainz */
async function fillAlternatives(el, starts, target, startName, ownSongs){
  if(!el) return;
  el.innerHTML = '<div class="busy"><span class="spin"></span><span>Suche andere Wege im Musiknetz …</span></div>';
  let list;
  try{ list = await altPaths(starts, target); }catch(e){ el.innerHTML = `<p class="muted small">Andere Wege nicht verfügbar: ${esc(e.message)}</p>`; return; }
  if(!document.body.contains(el)) return;
  if(!list.length){ el.innerHTML = '<p class="muted small">Im Musiknetz ist kein Weg gespeichert. Das passiert bei Bands, die dort fehlen.</p>'; return; }
  const draw = () => {
    const best = list[0].songs;
    el.innerHTML = (ownSongs ? `<p class="small">${ownSongs < best ? `Dein Weg mit ${ownSongs} Songs ist kürzer als alles im Musiknetz.` : ownSongs === best ? `Dein Weg ist so kurz wie der kürzeste im Musiknetz (${best} Songs).` : `Kürzester Weg im Musiknetz: ${best} Songs, deiner hatte ${ownSongs}.`}</p>` : '')
      + list.map((p, i) => altItemHtml(p, i, startName)).join('');
    el.querySelectorAll('[data-altload]').forEach(b => b.onclick = async () => {
      const p = list[+b.dataset.altload];
      b.disabled = true; b.textContent = 'Hole Songs aus MusicBrainz …';
      try{
        const copy = p.edges.map(e => ({ ...e, via:{ ...e.via } }));
        if(await verifyPath(copy, { usedRecs:new Set() })){ p.edges = copy; p.loaded = true; recordPath(copy); }
        else { list.splice(+b.dataset.altload, 1); toast('Ein Schritt dieses Wegs ist in MusicBrainz nicht mehr belegt'); }
      }catch(e){ handleErr(e); }
      if(document.body.contains(el)) draw();
    });
  };
  draw();
}
