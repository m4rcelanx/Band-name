<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Band-Kette</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: eine Spalte wie eine Setlist; Songs als Karten, dazwischen Verbindungslinien mit dem Beleg */
:root{
  --bg:#15121F; --surface:#1F1B2D; --surface2:#2A2540; --line:#3A3456;
  --fg:#F4EFE6; --muted:#A79FBD; --accent:#FF6B3D; --accent-ink:#1A0E08;
  --ok:#5ED3A5; --band:#93A9FF; --claim:#F2C14E; --bad:#FF5C7A;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--band)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;line-height:1.05}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:600}
p{margin:0}
.eyebrow{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.iconbtn:disabled{opacity:.4}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px;font:13px/1.4 var(--f-mono);color:var(--fg);resize:vertical}
input[type=text],input[type=search]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px}
input::placeholder{color:var(--muted)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.toggle{flex-direction:row;justify-content:space-between;align-items:center;color:var(--fg);font-size:14px;gap:12px}
.toggle small{display:block;color:var(--muted);font-size:12px}
.toggle input,.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.check{flex-direction:row;align-items:center;gap:10px;color:var(--fg);font-size:14px}

.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.pick{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:92px;min-width:0}
.pick.set{border-style:solid;border-color:var(--accent)}
.pick b{font-family:var(--f-display);font-size:16px;overflow-wrap:anywhere}
.arrow{align-self:center;font:600 18px var(--f-mono);color:var(--accent)}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .txt{min-width:0;flex:1}
.item .t1{font-weight:600;overflow-wrap:anywhere}
.item .t2{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .t2 mark{background:none;color:var(--ok);font-weight:600}
.tag{font:500 11px/1 var(--f-mono);padding:5px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);flex:none;white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag.win{background:var(--accent);color:var(--accent-ink)}
.tag.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.tag.claim{background:color-mix(in srgb,var(--claim) 18%,transparent);color:var(--claim)}

.gamehead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.route{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.route b{font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stats{display:flex;gap:14px;font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats b{color:var(--fg)}

.chain{display:flex;flex-direction:column}
.node{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.node.endpoint{background:transparent;border-style:dashed}
.node.endpoint.reached{border-style:solid;border-color:var(--accent)}
.node .txt{min-width:0;flex:1}
.node .t1{font-weight:600;overflow-wrap:anywhere}
.node .t2{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.num{font:500 12px var(--f-mono);color:var(--muted);min-width:22px;text-align:center;flex:none}
.play{font:500 11px var(--f-mono);color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 8px;flex:none}
.link{display:flex;align-items:stretch;gap:12px;padding-left:20px;min-height:34px}
.link .bar{width:3px;border-radius:2px;background:var(--ok);flex:none}
.link.band .bar{background:var(--band)}
.link.claim .bar{background:repeating-linear-gradient(var(--claim) 0 6px,transparent 6px 10px)}
.link.bad .bar{background:var(--bad)}
.link .lbl{font:500 12px/1.4 var(--f-mono);color:var(--ok);padding:7px 0;min-width:0;overflow-wrap:anywhere}
.link.band .lbl{color:var(--band)} .link.claim .lbl{color:var(--claim)} .link.bad .lbl{color:var(--bad)}
.link .lbl a{color:inherit}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px}
.chip.on{background:var(--ok);border-color:var(--ok);color:#0B1F17;font-weight:600}
.chip.hint{border-style:dashed;color:var(--band)}
.chip.hint.on{background:var(--band);border-color:var(--band);color:#0E1430}

.sheet{position:fixed;inset:0;background:rgba(8,6,14,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>.card{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}
.busy{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hero{text-align:center;display:flex;flex-direction:column;gap:6px;padding:10px 0}
.big{font:800 54px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.verdict{border-radius:12px;padding:12px 14px;font-weight:600}
.verdict.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.verdict.claim{background:color-mix(in srgb,var(--claim) 15%,transparent);color:var(--claim)}
.verdict.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
@media (prefers-reduced-motion:reduce){.shake,.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="sheetRoot"></div>

<script>
/* ============ Grundlagen ============ */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('bk2_'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('bk2_'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('bk2_'+k); }catch(e){} }
};
const BASE = location.href.split('#')[0];
function toast(msg){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 3000); }
function settings(){ return Object.assign({ maxSongs:0, bandLinks:true, colleagues:false, claims:true, hints:false }, LS.get('settings', {})); }

const PRESETS = [
  {s:['Seiler und Speer','AT'], t:['Deichkind','DE'], tag:'Männerwochenende'},
  {s:['Helene Fischer','DE'], t:['The Pretty Reckless','US'], tag:'Männerwochenende'},
  {s:['Volbeat','DK'], t:['Red Hot Chili Peppers','US'], tag:'Männerwochenende'},
  {s:['Pur','DE'], t:['Gorillaz','GB'], tag:'Männerwochenende'},
  {s:['Andreas Gabalier','AT'], t:['Metallica','US']},
  {s:['Die Toten Hosen','DE'], t:['Daft Punk','FR']},
  {s:['Rammstein','DE'], t:['Taylor Swift','US']},
  {s:['Peter Fox','DE'], t:['Foo Fighters','US']},
];
const POOL = [['AC/DC','AU'],['Linkin Park','US'],['Beyoncé','US'],['Peter Maffay','DE'],['Cro','DE'],['Queen','GB'],['Rihanna',''],['Sido','DE'],
  ['Coldplay','GB'],['Eminem','US'],['Udo Lindenberg','DE'],['Kraftklub','DE'],['Adele','GB'],['Snoop Dogg','US'],['Muse','GB'],['Nena','DE'],
  ['Bon Jovi','US'],['Ed Sheeran','GB'],['Herbert Grönemeyer','DE'],['Shakira','CO'],['Wanda','AT'],['Green Day','US'],['Nickelback','CA'],
  ['Beatsteaks','DE'],['Scooter','DE'],['Tokio Hotel','DE'],['The Weeknd','CA'],['Santiano','DE'],['Sportfreunde Stiller','DE'],
  ['Mark Forster','DE'],['Billie Eilish','US'],['Iron Maiden','GB'],['David Guetta','FR'],['Die Ärzte','DE'],['Slash','US'],['Nirvana','US']];

/* ============ MusicBrainz-Zugriff (max. 1 Anfrage pro Sekunde) ============ */
const MB = 'https://musicbrainz.org/ws/2/';
const queue = []; let pumping = false, lastCall = 0;
function mb(path, prio = 'low', kind = ''){
  return new Promise((res, rej) => {
    const job = { path, res, rej, kind };
    if(kind === 'search'){ for(let i = queue.length - 1; i >= 0; i--) if(queue[i].kind === 'search'){ queue[i].rej(Object.assign(new Error('veraltet'), {stale:true})); queue.splice(i, 1); } }
    if(prio === 'high') queue.unshift(job); else queue.push(job);
    pump();
  });
}
async function pump(){
  if(pumping) return; pumping = true;
  while(queue.length){
    const job = queue.shift();
    const wait = lastCall + 1100 - Date.now(); if(wait > 0) await sleep(wait);
    lastCall = Date.now();
    try{ job.res(await mbFetch(job.path)); }catch(e){ job.rej(e); }
  }
  pumping = false;
}
async function mbFetch(path, tries = 0){
  let r;
  try{ r = await fetch(MB + path + (path.includes('?') ? '&' : '?') + 'fmt=json', { headers:{ Accept:'application/json' } }); }
  catch(e){ throw new Error('Keine Verbindung zu MusicBrainz. Bist du online?'); }
  if((r.status === 503 || r.status === 429) && tries < 3){ await sleep(1500 * (tries + 1)); return mbFetch(path, tries + 1); }
  if(r.status === 404) throw Object.assign(new Error('Eintrag in MusicBrainz nicht gefunden'), {status:404});
  if(!r.ok) throw new Error('MusicBrainz antwortet mit Fehler ' + r.status);
  return r.json();
}
const luc = s => s.replace(/([+\-!(){}\[\]^"~*?:\\\/]|&&|\|\|)/g, '\\$1');
function handleErr(e){ if(e && e.stale) return; console.error(e); toast(e.message || 'Unbekannter Fehler'); }

const TYPE_DE = { Group:'Band', Person:'Person', Orchestra:'Orchester', Choir:'Chor', Character:'Figur' };
function artistPick(a){ return { id:a.id, name:a.name, type:a.type || '', country:a.country || '', dis:a.disambiguation || '' }; }
function artistMeta(a){ return [TYPE_DE[a.type] || a.type, a.country, a.dis].filter(Boolean).join(' · '); }

async function searchArtists(q){
  const r = await mb('artist?limit=15&query=' + encodeURIComponent(luc(q)), 'high', 'search');
  return (r.artists || []).map(artistPick);
}
async function findArtist(name, country){
  const exact = l => l.find(a => a.name.toLowerCase() === name.toLowerCase());
  if(country){
    const r = await mb('artist?limit=10&query=' + encodeURIComponent(`artist:"${luc(name)}" AND country:${country}`), 'high');
    const hit = exact((r.artists || []).map(artistPick)); if(hit) return hit;
  }
  const r2 = await mb('artist?limit=10&query=' + encodeURIComponent(`artist:"${luc(name)}"`), 'high');
  const l2 = (r2.artists || []).map(artistPick);
  return exact(l2) || l2[0] || null;
}
function recPick(r){
  const ac = r['artist-credit'] || [];
  return { id:r.id, title:r.title,
    artists:ac.filter(c => c.artist).map(c => ({ id:c.artist.id, name:c.artist.name })),
    credit:ac.map(c => (c.name || (c.artist && c.artist.name) || '') + (c.joinphrase || '')).join(''),
    year:(r['first-release-date'] || '').slice(0, 4), video:!!r.video };
}
async function searchRecordings(query, offset){
  const r = await mb(`recording?limit=100&offset=${offset}&query=` + encodeURIComponent(query), 'high', 'search');
  return { items:(r.recordings || []).map(recPick), total:r.count || 0 };
}
async function getRecording(id){ return recPick(await mb('recording/' + id + '?inc=artist-credits', 'high')); }

/* ============ Spotify-Links auflösen (ohne Spotify-Login) ============ */
const spTrackUrl = id => 'https://open.spotify.com/track/' + id;
const SPID = /^[A-Za-z0-9]{22}$/;
function parseSpotifyIds(text){
  const ids = []; const re = /(?:open\.spotify\.com\/(?:intl-[a-z]{2}(?:-[a-z]{2})?\/)?track\/|spotify:track:)([A-Za-z0-9]{22})/g; let m;
  while((m = re.exec(text))) if(!ids.includes(m[1])) ids.push(m[1]);
  return ids;
}
const normName = n => (n || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/^the\s+/, '').replace(/[^a-z0-9]+/g, '');
const cleanTitle = t => (t || '').replace(/\s+-\s+.*$/, '').replace(/\s*[\(\[][^\)\]]*[\)\]]/g, '').trim();
const normTitle = t => cleanTitle(t).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
function featNames(title){
  const m = (title || '').match(/[\(\[](?:feat\.?|ft\.?|with|mit)\s+([^\)\]]+)[\)\]]/i);
  return m ? m[1].split(/,\s*|\s+&\s+|\s+and\s+|\s+und\s+/i).map(s => s.trim()).filter(Boolean) : [];
}
const sameArtist = (a, b) => (a.id && b.id) ? a.id === b.id : normName(a.name) === normName(b.name);

/* Weg 1: MusicBrainz kennt den Spotify-Link direkt */
async function mbBySpotify(id){
  try{
    const u = await mb('url?resource=' + encodeURIComponent(spTrackUrl(id)) + '&inc=recording-rels', 'high');
    const rel = (u.relations || []).find(r => r.recording);
    return rel ? await getRecording(rel.recording.id) : null;
  }catch(e){ if(e.status === 404) return null; throw e; }
}
/* Weg 2: Odesli liefert Titel und Künstler (veraltet, darum nur als Zusatz) */
let odesliDead = false, odLast = 0;
async function odesli(url){
  if(odesliDead) return null;
  const go = async () => { const wait = odLast + 1500 - Date.now(); if(wait > 0) await sleep(wait); odLast = Date.now();
    return fetch('https://api.song.link/v1-alpha.1/links?userCountry=DE&url=' + encodeURIComponent(url)); };
  try{
    let r = await go();
    if(r.status === 429){ await sleep(8000); r = await go(); }
    if(r.status === 410){ odesliDead = true; return null; }
    if(!r.ok) return null;
    const j = await r.json(); const ents = Object.values(j.entitiesByUniqueId || {});
    const ent = ents.find(e => e.apiProvider === 'spotify' && e.type === 'song') || ents[0];
    if(!ent || !ent.title) return null;
    return { spotifyId: ent.apiProvider === 'spotify' ? ent.id : null, title: ent.title,
      artists: (ent.artistName || '').split(/,\s*|\s+&\s+/).map(s => s.trim()).filter(Boolean) };
  }catch(e){ return null; }
}
/* Weg 3: Titel aus dem öffentlichen Spotify-Einbettungsdienst */
async function spOembed(id){
  try{ const r = await fetch('https://open.spotify.com/oembed?url=' + encodeURIComponent(spTrackUrl(id))); if(!r.ok) return null; const j = await r.json(); return j.title ? { title:j.title } : null; }
  catch(e){ return null; }
}
function dedupeRecs(list){
  const seen = new Set();
  return list.filter(r => { if(r.video) return false; const k = normTitle(r.title) + '|' + r.artists.map(a => a.id).sort().join(','); if(seen.has(k)) return false; seen.add(k); return true; });
}
async function mbCandidates(title, artist){
  let q = `recording:"${luc(cleanTitle(title))}"`;
  if(artist) q += ` AND artist:(${luc(artist)})`;
  const r = await mb('recording?limit=50&query=' + encodeURIComponent(q), 'high');
  return dedupeRecs((r.recordings || []).map(recPick));
}
function autoPick(cands, title, names, ctx){
  if(!title) return null;
  const tOk = cands.filter(r => normTitle(r.title) === normTitle(title));
  if(names.length){
    let best = null, bestHit = 0;
    for(const r of tOk){
      const hit = names.filter(n => r.artists.some(a => normName(a.name) === normName(n))).length;
      if(hit > bestHit || (hit === bestHit && best && Math.abs(r.artists.length - names.length) < Math.abs(best.artists.length - names.length))){ best = r; bestHit = hit; }
    }
    return bestHit >= 1 ? best : null;
  }
  const known = [...ctx.anchors, ctx.target].filter(a => a && a.id);
  const linked = tOk.filter(r => r.artists.some(a => known.some(k => k.id === a.id)));
  const groups = new Set(linked.map(r => r.artists.map(a => a.id).sort().join(',')));
  return groups.size === 1 ? linked[0] : null;
}
async function recFromNames(id, title, names, ctx){
  const known = [...ctx.anchors, ctx.start, ctx.target].filter(a => a && a.id);
  const artists = [];
  for(const n of names){
    const k = known.find(a => normName(a.name) === normName(n));
    if(k){ artists.push({ id:k.id, name:k.name }); continue; }
    const r = await mb('artist?limit=5&query=' + encodeURIComponent(`artist:"${luc(n)}"`), 'high');
    const hit = (r.artists || []).find(a => normName(a.name) === normName(n));
    artists.push(hit ? { id:hit.id, name:hit.name } : { id:null, name:n });
  }
  return { id:null, title:title || 'Spotify-Song', artists, credit:names.join(', '), year:'', spotifyId:id, noMb:true };
}
async function resolveSpotify(id, ctx){
  const direct = await mbBySpotify(id);
  if(direct) return { ...direct, spotifyId:id };
  const od = await odesli(spTrackUrl(id));
  let title = od ? od.title : null, names = od ? od.artists : [];
  if(!title){ const oe = await spOembed(id); title = oe ? oe.title : null; }
  if(title) names = [...new Set([...names, ...featNames(title)])];
  let cands = [];
  if(title){
    cands = await mbCandidates(title, names[0]);
    if(!autoPick(cands, title, names, ctx)) cands = dedupeRecs(cands.concat(await mbCandidates(title)));
  }
  const pick = autoPick(cands, title, names, ctx);
  if(pick) return { ...pick, spotifyId:id };
  return chooseRecording(id, title, names, cands, ctx);
}
function chooseRecording(id, title, names, cands, ctx){

      }).join('') : '<p class="muted small">Keine Treffer. Ändere oben den Suchbegriff, z. B. Titel und Künstler.</p>';

/* Beziehungen: Mitglied, Kollaboration (Duo-Projekte), Künstlername derselben Person */
const LINK_TYPES = { 'member of band':1, 'collaboration':1, 'is person':1 };
const relCache = new Map();
function artistInfo(id, prio = 'low'){
  if(relCache.has(id)) return relCache.get(id);
  const p = mb('artist/' + id + '?inc=artist-rels', prio).then(a => ({
    ...artistPick(a),
    rels:(a.relations || []).filter(r => LINK_TYPES[r.type] && r.artist).map(r => ({
      type:r.type, dir:r.direction, artist:{ id:r.artist.id, name:r.artist.name },
      begin:(r.begin || '').slice(0, 4), end:(r.end || '').slice(0, 4), ended:!!r.ended }))
  }));
  relCache.set(id, p); p.then(i => relDone.set(id, i)).catch(() => relCache.delete(id));
  return p;
}
function years(r){ return r.begin ? ` (${r.begin}–${r.ended ? (r.end || '?') : 'heute'})` : ''; }
function relText(q, r){
  const was = r.ended ? 'war' : 'ist';
  if(r.type === 'member of band') return r.dir === 'forward' ? `${q.name} ${was} Mitglied von ${r.artist.name}${years(r)}` : `${r.artist.name} ${was} Mitglied von ${q.name}${years(r)}`;
  if(r.type === 'collaboration') return r.dir === 'forward' ? `${q.name} gehört zu ${r.artist.name}` : `${r.artist.name} gehört zu ${q.name}`;
  return `${q.name} und ${r.artist.name} sind dieselbe Person`;
}

/* Kernprüfung: findet die stärkste belegbare Verbindung zwischen zwei Credit-Listen */
async function findLink(prev, next, opts, prio = 'high'){
  const shared = next.filter(a => prev.some(p => sameArtist(p, a)));
  if(shared.length) return { type:'feat', via:shared.map(a => ({id:a.id, name:a.name})) };
  if(!opts.bandLinks) return null;
  const nextIds = new Set(next.filter(a => a.id).map(a => a.id));
  const prevInfos = await Promise.all(prev.filter(p => p.id).map(p => artistInfo(p.id, prio)));
  for(const info of prevInfos){
    for(const r of info.rels){
      if(nextIds.has(r.artist.id)) return { type:'band', a:{id:info.id, name:info.name}, b:r.artist, text:relText(info, r) };
    }
  }
  if(opts.colleagues){
    const nextInfos = await Promise.all(next.filter(n => n.id).map(n => artistInfo(n.id, prio)));
    for(const pi of prevInfos){
      const pBands = pi.rels.filter(r => r.type === 'member of band' && r.dir === 'forward');
      for(const ni of nextInfos){
        for(const r of ni.rels){
          if(r.type !== 'member of band' || r.dir !== 'forward') continue;
          const hit = pBands.find(b => b.artist.id === r.artist.id);
          if(hit) return { type:'colleague', a:{id:pi.id, name:pi.name}, b:{id:ni.id, name:ni.name}, band:r.artist,
            text:`${pi.name} und ${ni.name} spielten beide bei ${r.artist.name}` };
        }
      }
    }
  }
  return null;
}

/* ============ Tipps: Wegsuche von der Kette zur Zielband ============ */
/* Knoten sind Künstler. Kanten: gemeinsamer Song (Feat) oder Bandmitgliedschaft.
   Gesucht wird von beiden Seiten gleichzeitig, bis sich die Suchräume treffen. */
const collabCache = new Map();
/* Feat-Partner eines Künstlers, sortiert nach Häufigkeit: wer öfter mitspielt, ist ein besserer Kandidat */
function collabsOf(id){
  if(collabCache.has(id)) return collabCache.get(id);
  const p = mb('recording?limit=100&query=' + encodeURIComponent('arid:' + id), 'high').then(r => {
    const out = new Map();
    (r.recordings || []).map(recPick).forEach(rec => {
      if(rec.video || rec.artists.length < 2) return;
      rec.artists.forEach(a => {
        if(!a.id || a.id === id) return;
        const e = out.get(a.id); if(e) e.n++; else out.set(a.id, { artist:a, rec, n:1 });
      });
    });
    return [...out.values()].sort((x, y) => y.n - x.n);
  });
  collabCache.set(id, p); p.catch(() => collabCache.delete(id));
  return p;
}

/* Bandmitgliedschaften gesammelt aus Wikidata (verknüpft über die MusicBrainz-ID).
   Nur zum schnellen Finden; jeder gefundene Band-Link wird danach in MusicBrainz gegengeprüft. */
const wdCache = new Map(); let wdFails = 0;
async function wdFetch(ids){
  if(wdFails >= 2) return;
  const need = [...new Set(ids)].filter(id => MBID.test(id) && !wdCache.has(id)).slice(0, 40);
  if(!need.length) return;
  const q = `SELECT ?mb ?omb ?oLabel ?dir ?start ?end WHERE {
    VALUES ?mb { ${need.map(i => `"${i}"`).join(' ')} }
    ?a wdt:P434 ?mb .
    OPTIONAL {
      { ?a p:P463 ?st . ?st ps:P463 ?o . BIND("forward" AS ?dir) } UNION
      { ?o p:P463 ?st . ?st ps:P463 ?a . BIND("backward" AS ?dir) } UNION
      { ?a p:P527 ?st . ?st ps:P527 ?o . BIND("backward" AS ?dir) } UNION
      { ?o p:P527 ?st . ?st ps:P527 ?a . BIND("forward" AS ?dir) }
      ?o wdt:P434 ?omb .
      OPTIONAL { ?st pq:P580 ?start } OPTIONAL { ?st pq:P582 ?end }
    }
    SERVICE wikibase:label { bd:serviceParam wikibase:language "de,en". }
  }`;
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), 15000) : null;
  try{
    const r = await fetch('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q), { headers:{ Accept:'application/sparql-results+json' }, signal:ctl ? ctl.signal : undefined });
    if(!r.ok) throw new Error('Wikidata ' + r.status);
    const j = await r.json();
    need.forEach(id => wdCache.set(id, { found:false, rels:[] }));
    const seen = new Set();
    for(const b of j.results.bindings){
      const mb = b.mb.value; const e = wdCache.get(mb); if(!e) continue; e.found = true;
      if(!b.omb || !b.dir) continue;
      const k = mb + '>' + b.omb.value + b.dir.value; if(seen.has(k) || b.omb.value === mb) continue; seen.add(k);
      const y = v => v ? v.value.slice(0, 4) : '';
      e.rels.push({ type:'member of band', dir:b.dir.value, artist:{ id:b.omb.value, name:b.oLabel ? b.oLabel.value : '?' },
        begin:y(b.start), end:y(b.end), ended:!!b.end, src:'wd' });
    }
    wdFails = 0;
  }catch(e){ wdFails++; }
  finally{ if(timer) clearTimeout(timer); }
}

const relDone = new Map();
const badEdges = new Set();
async function neighbors(id, name, opts){
  const out = [];
  if(opts.bandLinks){
    const wd = wdCache.get(id), mbInfo = relDone.get(id);
    let rels = [];
    if(wd && wd.found) rels = wd.rels.slice();
    if(mbInfo) mbInfo.rels.forEach(r => { if(!rels.some(x => x.artist.id === r.artist.id)) rels.push({ ...r, src:'mb' }); });
    if(!(wd && wd.found) && !mbInfo){ const info = await artistInfo(id, 'high'); info.rels.forEach(r => rels.push({ ...r, src:'mb' })); }
    rels.forEach(r => {
      if(badEdges.has(id + '>' + r.artist.id)) return;
      out.push({ artist:r.artist, cost:0.8, via:{ type:'band', src:r.src, from:id, to:r.artist.id, text:relText({ id, name }, r) } });
    });
  }
  const cs = (await collabsOf(id)).filter(c => !opts.usedRecs.has(c.rec.id)).slice(0, 40);
  cs.forEach((c, i) => out.push({ artist:c.artist, cost:1 + i * 0.01, via:{ type:'feat', rec:c.rec } }));
  return out;
}
function newHintState(starts, target){
  const A = new Map(), B = new Map();
  starts.forEach(a => A.set(a.id, { prev:null, via:null, name:a.name, cost:0 }));
  B.set(target.id, { next:null, via:null, name:target.name, cost:0 });
  return { A, B, qA:starts.map(a => a.id), qB:[target.id], eA:0, eB:0, expanded:0, done:false, path:null };
}
function buildPath(st, meet){
  const left = []; let cur = meet;
  while(st.A.get(cur).prev){ const e = st.A.get(cur); left.unshift({ from:e.prev, fromName:st.A.get(e.prev).name, to:cur, toName:e.name, via:e.via }); cur = e.prev; }
  const right = []; cur = meet;
  while(st.B.get(cur).next){ const e = st.B.get(cur); right.push({ from:cur, fromName:e.name, to:e.next, toName:st.B.get(e.next).name, via:e.via }); cur = e.next; }
  return left.concat(right);
}
function popMin(q, map){ let bi = 0; for(let i = 1; i < q.length; i++) if(map.get(q[i]).cost < map.get(q[bi]).cost) bi = i; return q.splice(bi, 1)[0]; }
async function prefetchWd(st){
  const pick = (q, map) => q.filter(id => !wdCache.has(id)).sort((x, y) => map.get(x).cost - map.get(y).cost).slice(0, 20);
  const ids = [...pick(st.qA, st.A), ...pick(st.qB, st.B)];
  if(ids.length) await wdFetch(ids);
}
/* Beste-zuerst-Suche von beiden Seiten: günstigste Kandidaten zuerst, Band-Links sind billiger als Feats */
async function searchPath(st, opts, budget, onProgress, isCancelled){
  for(const id of st.A.keys()) if(st.B.has(id)){ st.path = buildPath(st, id); return st.path; }
  let n = 0;
  while(n < budget && (st.qA.length || st.qB.length)){
    if(isCancelled()) return null;
    if(opts.bandLinks) await prefetchWd(st);
    const sideA = st.qA.length > 0 && (st.eA <= st.eB || !st.qB.length);
    const q = sideA ? st.qA : st.qB, mine = sideA ? st.A : st.B, other = sideA ? st.B : st.A;
    const id = popMin(q, mine); n++; st.expanded++; if(sideA) st.eA++; else st.eB++;
    const node = mine.get(id);
    onProgress(st.expanded, node.name);
    const nb = await neighbors(id, node.name, opts);
    for(const x of nb){
      const aid = x.artist.id; if(!aid || mine.has(aid)) continue;
      const cost = node.cost + x.cost;
      mine.set(aid, sideA ? { prev:id, via:x.via, name:x.artist.name, cost } : { next:id, via:x.via, name:x.artist.name, cost });
      if(other.has(aid)){ st.path = buildPath(st, aid); return st.path; }
      q.push(aid);
    }
  }
  if(!st.qA.length && !st.qB.length) st.done = true;
  return null;
}
/* Band-Links aus Wikidata vor der Anzeige in MusicBrainz bestätigen */
async function verifyPath(p){
  for(const e of p){
    if(e.via.type !== 'band' || e.via.src !== 'wd') continue;
    const [a, b] = await Promise.all([artistInfo(e.from, 'high'), artistInfo(e.to, 'high')]);
    const ra = a.rels.find(r => r.artist.id === e.to), rb = b.rels.find(r => r.artist.id === e.from);
    if(!ra && !rb){ badEdges.add(e.from + '>' + e.to); badEdges.add(e.to + '>' + e.from); return false; }
    e.via.text = ra ? relText(a, ra) : relText(b, rb); e.via.src = 'mb';
  }
  return true;
}
const hintStates = new Map();

let draft = { start:null, target:null, best:null };

let timerId = null, adding = false;

function anchors(){

const firstWithId = list => (list || []).find(a => a.id) || null;
function isWin(rec){ return !game.free && rec.artists.some(a => sameArtist(a, game.ch.target)); }
function fmtTime(ms){ const s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function prefetchAnchors(){ if(settings().bandLinks) anchors().filter(a => a.id).forEach(a => artistInfo(a.id).catch(() => {})); }

/* Freie Kette abschließen: Start- und Zielband aus erstem und letztem Song wählen */
function openFinishSheet(){
  if(!game || game.steps.length < 2){ toast('Mindestens zwei Songs, dann kannst du abschließen'); return; }
  const first = game.steps[0].rec.artists.filter(a => a.id), last = game.steps[game.steps.length - 1].rec.artists.filter(a => a.id);
  if(!first.length || !last.length){ toast('Erster oder letzter Song hat keinen Künstler aus MusicBrainz'); return; }
  const opts = (list, name) => list.map((a, i) => `<label class="check"><input type="radio" name="${name}" value="${i}" ${i === 0 ? 'checked' : ''}> ${esc(a.name)}</label>`).join('');
  sheet(`<h2>Kette abschließen</h2>
    <p class="muted small">Welche Bands sind Start und Ziel deiner Kette?</p>
    <span class="eyebrow">Startband (erster Song)</span>${opts(first, 'fs')}
    <span class="eyebrow">Zielband (letzter Song)</span>${opts(last, 'ft')}
    <div class="row"><button class="btn ghost" data-close>Weiterbauen</button><button class="btn primary" id="finSave">Abschließen</button></div>`);
  $('#finSave').onclick = () => {

    game.steps[0].link = { type:'start', via:[{ id:s.id, name:s.name }] };
    game.won = true; game.finishedAt = Date.now(); LS.set('game', game); saveHistory();
    closeSheet(); view = 'result'; render();
  };
}
function addStep(rec, link){
  game.steps.push({ rec, link });
  if(isWin(rec)){ game.won = true; game.finishedAt = Date.now(); saveHistory(); view = 'result'; }
  LS.set('game', game);
  if(!game.won){ search.chip = firstWithId(rec.artists); search.q = ''; render(); if(!batchRunning) runSearch(true); prefetchAnchors(); }
  else render();
}
function isDuplicate(rec){
  return game.steps.some(st => (rec.id && st.rec.id === rec.id) || (rec.spotifyId && st.rec.spotifyId === rec.spotifyId));
}
/* Gibt true zurück, wenn der Song in der Kette gelandet ist */
async function tryAdd(rec, rowEl){
  if(adding) return false;
  const s = settings();
  if(s.maxSongs && game.steps.length >= s.maxSongs){ toast(`Limit von ${s.maxSongs} Songs erreicht. Nimm einen Schritt zurück.`); return false; }
  if(isDuplicate(rec)){ toast('Der Song ist schon in deiner Kette'); return false; }
  if(game.free && !game.steps.length){
    if(!rec.artists.some(a => a.id)){ toast('Der erste Song braucht einen Künstler aus MusicBrainz'); return false; }
    addStep(rec, { type:'first' }); return true;
  }
  adding = true;
  const busy = $('#addBusy'); if(busy){ busy.hidden = false; busy.querySelector('span:last-child').textContent = 'Prüfe Verbindung in MusicBrainz …'; }
  try{
    const link = await findLink(anchors(), rec.artists, s);
    if(link){ adding = false; addStep(rec, link); return true; }
    if(rowEl){ rowEl.classList.remove('shake'); void rowEl.offsetWidth; rowEl.classList.add('shake'); }
    openNoLinkSheet(rec);
    return false;
  }catch(e){ handleErr(e); return false; }
  finally{ adding = false; const b = $('#addBusy'); if(b) b.hidden = true; }
}

/* Spotify-Links einfügen: einzeln oder als ganze Liste */
function setLinkBusy(t){
  linkBusyText = t || '';
  const el = $('#linkBusy'); if(!el) return;
  el.hidden = !linkBusyText; el.querySelector('span:last-child').textContent = linkBusyText;
}
async function addFromLinks(text){
  if(batchRunning || !game || game.won) return;
  const ids = parseSpotifyIds(text);
  const shorts = text.match(/https?:\/\/spotify\.link\/[A-Za-z0-9]+/g) || [];
  batchRunning = true;
  try{
    for(const s of shorts){
      setLinkBusy('Kurzlink wird aufgelöst …');
      const od = await odesli(s);
      if(od && od.spotifyId){ if(!ids.includes(od.spotifyId)) ids.push(od.spotifyId); }
      else toast('Kurzlink ließ sich nicht auflösen. In Spotify „Link kopieren“ nutzen.');
    }
    if(!ids.length){
      toast(/spotify\.com\/(?:intl-[a-z-]+\/)?(playlist|album)/.test(text) ? 'Playlists und Alben gehen nicht. Bitte einzelne Song-Links einfügen.' : 'Kein Spotify-Song-Link gefunden');
      return;
    }
    let added = 0;
    for(let i = 0; i < ids.length; i++){
      if(!game || game.won) break;
      const label = ids.length > 1 ? `Song ${i + 1} von ${ids.length}: ` : '';
      setLinkBusy(label + 'Spotify-Link wird erkannt …');
      let rec;
      try{ rec = await resolveSpotify(ids[i], { anchors:anchors(), start:game.ch.start, target:game.ch.target }); }
      catch(e){ handleErr(e); break; }
      if(!rec){ if(i < ids.length - 1) toast('Abgebrochen. Restliche Links wurden nicht übernommen.'); break; }
      setLinkBusy(label + 'Prüfe Verbindung …');
      const ok = await tryAdd(rec);
      if(!ok){ if(i < ids.length - 1) toast(`Bei Song ${i + 1} angehalten. Die restlichen Links bleiben im Feld.`); linkInput = ids.slice(i + 1).map(spTrackUrl).join('\n'); break; }
      added++;
      if(i === ids.length - 1) linkInput = '';
    }
    if(added && !(game && game.won)) toast(added === 1 ? 'Song hinzugefügt' : `${added} Songs hinzugefügt`);
  }finally{
    batchRunning = false; setLinkBusy('');
    const ta = $('#spIn'); if(ta) ta.value = linkInput;
    if(view === 'game' && game && !game.won) runSearch(true);
  }
}
function undo(){
  if(!game || !game.steps.length) return;
  game.steps.pop(); game.won = false; game.finishedAt = null;
  if(game.free){ game.ch = { start:null, target:null }; if(game.steps[0]) game.steps[0].link = { type:'first' }; }
  LS.set('game', game);
  view = 'game'; search.chip = firstWithId(anchors()); search.q = '';
  render(); runSearch(true);
}
function saveHistory(){
  const h = LS.get('history', []);
  h.unshift({ s:game.ch.start.name, t:game.ch.target.name, n:game.steps.length,
    claims:game.steps.filter(x => x.link.type === 'claim').length, ms:game.finishedAt - game.startedAt, at:game.finishedAt, hints:game.hints || 0, solved:!!game.solved, code:chainCode(game) });
  LS.set('history', h.slice(0, 30));
}

/* Prüf-Code: Start, Ziel und alle Aufnahmen als MusicBrainz-IDs; ! markiert unbelegte Glieder */
/* Glied: [MusicBrainz-Aufnahme]~[Spotify-ID]~[Künstler-IDs, nur ohne Aufnahme] und ! für unbelegt */
function stepToken(s){
  const r = s.rec; let t = r.id || '';
  if(r.spotifyId) t += '~' + r.spotifyId;
  if(!r.id) t += '~' + r.artists.filter(a => a.id).map(a => a.id).join(',');
  return t + (s.link.type === 'claim' ? '!' : '');
}
function parseToken(p){
  const claim = p.endsWith('!'); const [mbid = '', sp = '', arts = ''] = p.replace(/!$/, '').split('~');
  return { mbid, sp, arts:arts ? arts.split(',') : [], claim };
}
function chainCode(g){ return [g.ch.start.id, g.ch.target.id, ...g.steps.map(stepToken)].join('.'); }
const MBID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
function tokenValid(t){ return (t.mbid ? MBID.test(t.mbid) : !!t.sp) && (!t.sp || SPID.test(t.sp)) && t.arts.every(a => MBID.test(a)); }

async function startPreset(p, btn){
  const tag = btn.querySelector('.tag'); tag.textContent = 'Suche …';
  try{
    const a = await findArtist(p.s[0], p.s[1]); const b = await findArtist(p.t[0], p.t[1]);

    newGame(a, b);
  }catch(e){ handleErr(e); tag.textContent = 'Spielen'; }
}
async function randomChallenge(){

/* ---------- Kette zeichnen ---------- */
function linkHtml(link, status){
  let cls = 'feat', txt = '';
  if(link.type === 'first') return '';
  if(link.type === 'start' || link.type === 'feat') txt = 'gemeinsam: ' + link.via.map(a => esc(a.name)).join(', ');
  else if(link.type === 'band'){ cls = 'band'; txt = `<a href="https://musicbrainz.org/artist/${esc(link.a.id)}/relationships" target="_blank" rel="noopener">${esc(link.text)}</a>`; }
  else if(link.type === 'colleague'){ cls = 'band'; txt = `<a href="https://musicbrainz.org/artist/${esc(link.band.id)}/relationships" target="_blank" rel="noopener">${esc(link.text)}</a>`; }
  else if(link.type === 'claim'){ cls = 'claim'; txt = 'nicht in MusicBrainz belegt, von der Gruppe bestätigt'; }
  else if(link.type === 'bad'){ cls = 'bad'; txt = esc(link.text); }
  return `<div class="link ${cls}"><span class="bar"></span><span class="lbl">${txt}</span></div>`;
}
function songNode(rec, i){
  const title = rec.id ? `<a href="https://musicbrainz.org/recording/${esc(rec.id)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(rec.title)}</a>` : esc(rec.title);
  return `<div class="node"><span class="num">${i + 1}</span>
    <div class="txt"><div class="t1">${title}</div>
    <div class="t2">${esc(rec.credit)}${rec.year ? ' · ' + esc(rec.year) : ''}${rec.noMb ? ' · Song nicht in MusicBrainz' : ''}</div></div>
    <a class="play" href="${spotifyUrl(rec)}" target="_blank" rel="noopener" aria-label="${rec.spotifyId ? 'In Spotify öffnen' : 'In Spotify suchen'}">▶ Spotify</a></div>`;
}
function endpointNode(a, label, reached){
  return `<div class="node endpoint ${reached ? 'reached' : ''}"><span class="num">${label === 'Start' ? '●' : '◎'}</span>
    <div class="txt"><div class="eyebrow">${label}</div><div class="t1">${esc(a.name)}</div><div class="t2">${esc(artistMeta(a))}</div></div></div>`;
}
function chainHtml(g, withTarget){
  if(!g.ch.start){
    if(!g.steps.length) return '<div class="node endpoint"><span class="num">●</span><div class="txt"><div class="eyebrow">Freie Kette</div><div class="t1">Such dir einen beliebigen ersten Song aus</div></div></div>';
    let free = '';
    g.steps.forEach((st, i) => { free += linkHtml(st.link) + songNode(st.rec, i); });
    return `<div class="chain">${free}</div>`;
  }
  let html = endpointNode(g.ch.start, 'Start', true);
  g.steps.forEach((st, i) => { html += linkHtml(st.link) + songNode(st.rec, i); });
  if(withTarget) html += `<div class="link"><span class="bar" style="background:var(--line)"></span><span class="lbl muted">…</span></div>` + endpointNode(g.ch.target, 'Ziel', false);
  return `<div class="chain">${html}</div>`;
}

function chipsHtml(){
  const a = anchors();
  let html = a.filter(x => x.id).map(x => `<button class="chip ${search.chip && search.chip.id === x.id ? 'on' : ''}" data-chip="${esc(x.id)}" data-name="${esc(x.name)}">${esc(x.name)}</button>`).join('');
  const shown = new Set([...a.map(x => x.id), ...(settings().hints ? hintList.map(x => x.id) : [])]);
  if(search.chip && !shown.has(search.chip.id)) html += `<button class="chip hint on" data-chip="${esc(search.chip.id)}" data-name="${esc(search.chip.name)}">${esc(search.chip.name)}</button>`;
  if(settings().hints && hintList.length) html += hintList.map(x => `<button class="chip hint ${search.chip && search.chip.id === x.id ? 'on' : ''}" data-chip="${esc(x.id)}" data-name="${esc(x.name)}">↔ ${esc(x.name)}</button>`).join('');
  return html;
}
let hintList = [];
async function loadHints(){
  hintList = [];
  if(!settings().hints || !settings().bandLinks || !game) return;
  const ids = anchors().filter(a => a.id).map(a => a.id);
  try{
    const infos = await Promise.all(ids.map(id => artistInfo(id, 'high')));
    const seen = new Set(ids);
    infos.forEach(i => i.rels.forEach(r => { if(!seen.has(r.artist.id)){ seen.add(r.artist.id); hintList.push(r.artist); } }));
    const c = $('#chips'); if(c){ c.innerHTML = chipsHtml(); bindChips(); }
  }catch(e){ handleErr(e); }
}
function visibleItems(){ return search.collabOnly ? search.items.filter(r => r.artists.length > 1) : search.items; }
function moreVisible(){ return search.items.length > 0 && search.offset < search.total; }
function resultsHtml(){
  const items = visibleItems();
  if(search.loading && !items.length) return '<div class="busy"><span class="spin"></span><span>Suche in MusicBrainz …</span></div>';
  if(!search.chip && !search.q.trim()) return '<p class="muted small">Tippe oben einen Künstler an oder suche nach einem Songtitel.</p>';
  if(!items.length) return '<p class="muted small">Keine Songs gefunden. Versuch einen anderen Titel oder Künstler.</p>';
  const prev = anchors().map(a => a.id);
  return items.map(r => {
    const ok = r.artists.some(a => prev.includes(a.id));
    const win = !!game.ch.target && r.artists.some(a => a.id === game.ch.target.id);
    let credit = esc(r.credit);
    r.artists.forEach(a => { if(prev.includes(a.id)) credit = credit.replace(esc(a.name), `<mark>${esc(a.name)}</mark>`); });
    return `<button class="item" data-res="${esc(r.id)}">
      <div class="txt"><div class="t1">${esc(r.title)}</div><div class="t2">${credit}${r.year ? ' · ' + esc(r.year) : ''}</div></div>
      ${win && ok ? '<span class="tag win">Ziel!</span>' : win ? '<span class="tag win">Zielband</span>' : ok ? '<span class="tag ok">gemeinsam</span>' : ''}</button>`;
  }).join('');
}

function bindResults(){
  $$('[data-res]').forEach(b => b.onclick = () => { const r = search.items.find(x => x.id === b.dataset.res); if(r) tryAdd(r, b); });
}
function recQuery(){
  const parts = [];
  if(search.chip) parts.push('arid:' + search.chip.id);
  const t = search.q.trim();
  if(t){ const e = luc(t); parts.push(`(recording:(${e}) OR artist:(${e}))`); }
  return parts.join(' AND ');
}
async function runSearch(reset){
  const query = recQuery();
  if(reset){ search.offset = 0; search.items = []; search.total = 0; }
  if(!query){ updateResults(); return; }
  const seq = ++search.seq;
  search.loading = true; updateResults();
  try{
    const { items, total } = await searchRecordings(query, search.offset);
    if(seq !== search.seq) return;
    const key = r => r.title.toLowerCase().replace(/\s*[\(\[].*?(live|remaster|version|edit|mix|demo|acoustic).*?[\)\]]/gi, '').trim() + '|' + r.artists.map(a => a.id).sort().join(',');
    const seen = new Set(search.items.map(key));
    const fresh = items.filter(r => !r.video && !seen.has(key(r)) && (seen.add(key(r)), true));
    if(search.chip && !search.q.trim()) fresh.sort((a, b) => b.artists.length - a.artists.length);
    search.items = search.items.concat(fresh); search.total = total; search.offset += 100;
  }catch(e){ handleErr(e); }
  if(seq === search.seq){ search.loading = false; updateResults(); }
}
function updateResults(){
  const r = $('#results'); if(!r) return;
  r.innerHTML = resultsHtml(); bindResults();
  const m = $('#btnMore'); if(m) m.hidden = !moreVisible();
}
function tick(){ const c = $('#clock'); if(c && game) c.textContent = fmtTime(Date.now() - game.startedAt); }

/* ---------- Tipps ---------- */
function hintOpts(){ return { bandLinks:settings().bandLinks, usedRecs:new Set(game.steps.map(s => s.rec.id).filter(Boolean)) }; }
function countHint(){ game.hints = (game.hints || 0) + 1; LS.set('game', game); }
function useSong(rec){ closeSheet(); tryAdd(rec); }
function searchArtistSongs(a){
  closeSheet(); LS.set('mode', 'search');
  search.chip = { id:a.id, name:a.name }; search.q = ''; render(); runSearch(true);
  const q = $('#q'); if(q) q.scrollIntoView({ block:'center' });
}
function stepCard(e, i){
  const head = i === 0 ? 'Nächster Song' : `Song ${i + 1}`;
  if(e.via.type === 'feat'){
    const r = e.via.rec;
    return `<div class="node"><span class="num">${i + 1}</span><div class="txt"><div class="eyebrow">${head}</div><div class="t1">${esc(r.title)}</div><div class="t2">${esc(r.credit)}</div></div>
      ${i === 0 ? '<button class="btn primary" data-use style="min-height:38px;padding:8px 12px">Übernehmen</button>' : ''}</div>`;
  }
  return `<div class="node"><span class="num">${i + 1}</span><div class="txt"><div class="eyebrow">${head}</div><div class="t1">Ein Song von ${esc(e.toName)}</div><div class="t2">${esc(e.via.text)}</div></div>
    ${i === 0 ? '<button class="btn primary" data-artist style="min-height:38px;padding:8px 12px">Songs suchen</button>' : ''}</div>`;
}
/* Gefundenen Weg komplett in die Kette übernehmen */
async function pickSongBy(a){
  const used = new Set(game.steps.map(s => s.rec.id));
  const r = await mb('recording?limit=25&query=' + encodeURIComponent('arid:' + a.id), 'high');
  const list = dedupeRecs((r.recordings || []).map(recPick)).filter(x => !used.has(x.id) && x.artists.some(y => y.id === a.id));
  return list.find(x => x.artists.length === 1) || list[0] || null;
}
async function applyPath(p, onStep){
  batchRunning = true; let added = 0;
  try{
    for(let i = 0; i < p.length; i++){
      const e = p[i];
      if(!game || game.won) break;
      onStep && onStep(i, p.length, e.toName);
      const rec = e.via.type === 'feat' ? { ...e.via.rec } : await pickSongBy({ id:e.to, name:e.toName });
      if(!rec){ toast(`Kein Song von ${e.toName} gefunden. Ab hier bitte selbst weiterbauen.`); break; }
      if(!(await tryAdd(rec))) break;
      added++;
    }
  }finally{ batchRunning = false; }
  if(game && !game.won && view === 'game'){ render(); runSearch(true); }
  return added;
}
function openHints(opts = {}){
  if(!game || game.won) return;
  if(game.free) return openNeighborHints();
  const starts = anchors().filter(a => a.id);
  if(!starts.length){ toast('Der letzte Song hat keinen Künstler aus MusicBrainz'); return; }
  const key = starts.map(a => a.id).sort().join(',') + '>' + game.ch.target.id + '|' + (settings().bandLinks ? 1 : 0);
  let st = hintStates.get(key);
  if(!st){ st = newHintState(starts, game.ch.target); hintStates.set(key, st); }
  let cancelled = false, level = 0;
  sheet(`<h2>Tipp</h2><div id="hintBody" style="display:flex;flex-direction:column;gap:12px"></div><button class="btn ghost" id="hintClose">Schließen</button>`, () => { cancelled = true; });
  $('#hintClose').onclick = () => { cancelled = true; closeSheet(); };
  const body = () => $('#hintBody');
  const showPath = p => {
    const first = p[0];
    const nextText = first.via.type === 'feat'
      ? `Der nächste Song verbindet <b>${esc(first.fromName)}</b> mit <b>${esc(first.toName)}</b>.`
      : `Weiter geht es über <b>${esc(first.toName)}</b>: ${esc(first.via.text)}.`;
    body().innerHTML = `
      <div class="verdict ok">Es gibt einen Weg mit noch ${p.length} Song${p.length === 1 ? '' : 's'} bis ${esc(game.ch.target.name)}.</div>
      <p class="muted small">Jede Stufe zählt als ein Tipp und wird im Ergebnis angezeigt.</p>
      <div id="lv1" ${level >= 1 ? '' : 'hidden'}><p>${nextText}</p></div>
      <div id="lv2" ${level >= 2 ? '' : 'hidden'}>${stepCard(first, 0)}</div>
      <div id="lv3" ${level >= 3 ? '' : 'hidden'}><div class="chain">${p.map((e, i) => (i ? `<div class="link ${e.via.type === 'band' ? 'band' : ''}"><span class="bar"></span><span class="lbl">${e.via.type === 'band' ? esc(e.via.text) : 'gemeinsam: ' + esc(e.fromName)}</span></div>` : '') + stepCard(e, i)).join('')}</div></div>
      <button class="btn" id="hintMore" ${level >= 3 ? 'hidden' : ''}>${['Kleiner Tipp: welcher Künstler?', 'Nächsten Song zeigen', 'Ganzen Weg zeigen'][level] || ''}</button>
      <button class="btn ghost" id="hintSolve">Komplette Kette ausgeben</button>
      <p class="muted small" style="margin-top:-4px">Hängt alle Songs bis zum Ziel an. Das Ergebnis wird als „von der App gelöst“ markiert.</p>`;
    $('#hintMore').onclick = () => { level++; countHint(); showPath(p); };
    $('#hintSolve').onclick = () => solve(p);
    $$('#hintBody [data-use]').forEach(b => b.onclick = () => useSong({ ...first.via.rec }));
    $$('#hintBody [data-artist]').forEach(b => b.onclick = () => searchArtistSongs({ id:first.to, name:first.toName }));
  };
  const solve = async p => {
    game.solved = true; LS.set('game', game);
    body().innerHTML = `<div class="busy"><span class="spin"></span><span id="solveProg">Baue die Kette …</span></div>`;
    $('#hintClose').hidden = true;
    const added = await applyPath(p, (i, n, name) => { const el = $('#solveProg'); if(el) el.textContent = `Song ${i + 1} von ${n}: weiter zu ${name}`; });
    closeSheet();
    if(game && !game.won) toast(added ? `${added} Songs angehängt, das Ziel ist noch nicht erreicht` : 'Die Kette konnte nicht automatisch erweitert werden');
  };
  const showNone = async () => {
    body().innerHTML = `<p class="muted small">In ${st.expanded} geprüften Künstlern noch kein Weg zu ${esc(game.ch.target.name)} gefunden${st.done ? ', und weitere Verbindungen gibt es in MusicBrainz nicht' : ''}.</p>
      ${st.done ? '' : '<button class="btn primary" id="hintAgain">Weitersuchen</button>'}
      <span class="eyebrow">Verbundene Künstler zum Weiterprobieren</span><div class="list" id="hintNb"><div class="busy"><span class="spin"></span><span>Lade …</span></div></div>`;
    if($('#hintAgain')) $('#hintAgain').onclick = () => run();
    try{
      if(settings().bandLinks) await wdFetch(starts.map(a => a.id));
      const nb = (await Promise.all(starts.map(a => neighbors(a.id, a.name, hintOpts())))).flat();
      const seen = new Set(); const list = nb.filter(x => !seen.has(x.artist.id) && seen.add(x.artist.id)).slice(0, 10);
      const el = $('#hintNb'); if(!el) return;
      el.innerHTML = list.length ? list.map((x, i) => `<button class="item" data-nb="${i}"><div class="txt"><div class="t1">${esc(x.artist.name)}</div><div class="t2">${x.via.type === 'band' ? esc(x.via.text) : 'z. B. ' + esc(x.via.rec.title) + ' – ' + esc(x.via.rec.credit)}</div></div></button>`).join('') : '<p class="muted small">Keine gefunden.</p>';
      $$('[data-nb]').forEach(b => b.onclick = () => { countHint(); const x = list[+b.dataset.nb]; x.via.type === 'feat' ? useSong({ ...x.via.rec }) : searchArtistSongs(x.artist); });
    }catch(e){ handleErr(e); }
  };
  const run = async () => {
    body().innerHTML = `<div class="busy"><span class="spin"></span><span id="hintProg">Suche einen Weg zu ${esc(game.ch.target.name)} …</span></div>
      <p class="muted small">MusicBrainz beantwortet etwa eine Anfrage pro Sekunde, das kann bis zu einer Minute dauern.</p>`;
    try{
      const prog = (n, name) => { const el = $('#hintProg'); if(el) el.textContent = `${n} Künstler geprüft, gerade: ${name}`; };
      let p = st.path || await searchPath(st, hintOpts(), 35, prog, () => cancelled);
      for(let tries = 0; p && !cancelled && tries < 4; tries++){
        const el = $('#hintProg'); if(el) el.textContent = 'Prüfe den gefundenen Weg in MusicBrainz …';
        if(await verifyPath(p)) break;
        st = newHintState(starts, game.ch.target); hintStates.set(key, st);
        p = await searchPath(st, hintOpts(), 35, prog, () => cancelled);
      }
      if(cancelled || !$('#hintBody')) return;
      if(p && opts.auto) return solve(p);
      p ? showPath(p) : showNone();
    }catch(e){ if(!cancelled && $('#hintBody')) body().innerHTML = `<div class="verdict bad">${esc(e.message)}</div>`; }
  };
  run();
}
async function openNeighborHints(){
  const starts = anchors().filter(a => a.id);
  if(!starts.length){ toast('Wähle zuerst einen ersten Song'); return; }
  sheet(`<h2>Mögliche nächste Schritte</h2><p class="muted small">Künstler, die mit dem letzten Song verbunden sind.</p>
    <div class="list" id="hintNb"><div class="busy"><span class="spin"></span><span>Lade Verbindungen …</span></div></div><button class="btn ghost" data-close>Schließen</button>`);
  try{
    if(settings().bandLinks) await wdFetch(starts.map(a => a.id));
      const nb = (await Promise.all(starts.map(a => neighbors(a.id, a.name, hintOpts())))).flat();
    const seen = new Set(); const list = nb.filter(x => !seen.has(x.artist.id) && seen.add(x.artist.id)).slice(0, 15);
    const el = $('#hintNb'); if(!el) return;
    el.innerHTML = list.length ? list.map((x, i) => `<button class="item" data-nb="${i}"><div class="txt"><div class="t1">${esc(x.artist.name)}</div><div class="t2">${x.via.type === 'band' ? esc(x.via.text) : 'z. B. ' + esc(x.via.rec.title) + ' – ' + esc(x.via.rec.credit)}</div></div></button>`).join('') : '<p class="muted small">Keine Verbindungen gefunden.</p>';
    $$('[data-nb]').forEach(b => b.onclick = () => { const x = list[+b.dataset.nb]; x.via.type === 'feat' ? useSong({ ...x.via.rec }) : searchArtistSongs(x.artist); });
  }catch(e){ handleErr(e); }
}

  const s = settings(); const prev = anchors();
  const artistLinks = [...prev, ...rec.artists].filter((a, i, l) => a.id && l.findIndex(x => x.id === a.id) === i)
    .map(a => `<a href="https://musicbrainz.org/artist/${esc(a.id)}/relationships" target="_blank" rel="noopener">${esc(a.name)}</a>`).join(' · ');
  sheet(`
    <h2>Keine Verbindung gefunden</h2>
    <p class="muted small">„${esc(rec.title)}“ (${esc(rec.credit)}) teilt sich laut MusicBrainz keinen Künstler mit dem vorherigen Song${s.bandLinks ? ', und es ist keine Bandmitgliedschaft eingetragen' : ''}.</p>
    <p class="small">Selbst nachschauen: ${artistLinks}</p>
    ${s.claims ? `
      <p class="muted small">Ihr wisst es besser? Dann könnt ihr das Glied als „unbelegt“ setzen. Es wird in der Kette gelb markiert und bei der Prüfung extra ausgewiesen.</p>
      <label class="check"><input type="checkbox" id="clOk"> Die Gruppe bestätigt diese Verbindung</label>
      <div class="row"><button class="btn ghost" data-close>Anderen Song wählen</button><button class="btn primary" id="clSave" disabled>Unbelegt setzen</button></div>`

    $('#clOk').onchange = e => $('#clSave').disabled = !e.target.checked;

/* ---------- Linkliste ---------- */
function spotifyUrl(rec){ if(rec.spotifyId) return spTrackUrl(rec.spotifyId); return 'https://open.spotify.com/search/' + encodeURIComponent(rec.title + ' ' + (rec.artists[0] ? rec.artists[0].name : '')); }
function linkListText(g, opts = {}){
  const head = `🎸 ${g.ch.start ? g.ch.start.name + ' → ' + g.ch.target.name : 'Freie Kette'} (${g.steps.length} Song${g.steps.length === 1 ? '' : 's'}${opts.finished ? '' : ', noch unterwegs'})`;
  const lines = [head, ''];
  g.steps.forEach((st, i) => {
    lines.push(`${i + 1}. ${st.rec.title} – ${st.rec.credit}`);
    lines.push(spotifyUrl(st.rec));
  });
  if(opts.code) lines.push('', 'Prüfen: ' + BASE + '#k=' + opts.code);
  return lines.join('\n');
}
function openLinkList(g, opts = {}){
  if(!g.steps.length){ toast('Noch keine Songs in der Liste'); return; }
  const text = linkListText(g, opts);
  sheet(`<h2>Linkliste</h2>
    <p class="muted small">Jeder Link öffnet den Song in Spotify. Teilen schickt die ganze Liste, z. B. in eure WhatsApp-Gruppe.</p>
    <div class="list">${g.steps.map((st, i) => `<a class="item" href="${spotifyUrl(st.rec)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">
      <span class="num">${i + 1}</span><div class="txt"><div class="t1">${esc(st.rec.title)}</div><div class="t2">${esc(st.rec.credit)}</div></div><span class="tag">▶ Spotify</span></a>`).join('')}</div>
    <label class="check small"><input type="checkbox" id="llCode" ${opts.code ? 'checked' : ''} ${opts.code ? '' : 'disabled'}> Prüf-Link anhängen</label>
    <div class="row"><button class="btn ghost" id="llCopy">Kopieren</button><button class="btn primary" id="llShare">Teilen</button></div>
    <button class="btn ghost" data-close>Schließen</button>`);
  const current = () => linkListText(g, { ...opts, code: $('#llCode').checked ? opts.code : null });
  $('#llCopy').onclick = () => copyText(current());
  $('#llShare').onclick = () => shareText(current());
}

  $('#btnShare').onclick = () => shareText(resultText());
  $('#btnLinks').onclick = () => openLinkList(game, { finished:true, code:chainCode(game) });
  $('#btnChallenge').onclick = () => {
    const best = game.best ? Math.min(game.best, game.steps.length) : game.steps.length;

  };

function linkPlain(l){
  if(l.type === 'band' || l.type === 'colleague') return '↳ ' + l.text;
  if(l.type === 'claim') return '↳ unbelegt (Gruppe)';
  return '';
}
function resultText(){
  const lines = [`🎸 ${game.solved ? 'Von der App gelöst' : 'Aufgabe erfüllt'}: ${game.ch.start.name} → ${game.ch.target.name}`, `${game.steps.length} Songs in ${fmtTime(game.finishedAt - game.startedAt)}${game.hints ? ` (${game.hints} Tipp${game.hints === 1 ? '' : 's'} genutzt)` : ''}`, ''];
  game.steps.forEach((st, i) => { const lp = linkPlain(st.link); if(lp) lines.push('   ' + lp); lines.push(`${i + 1}. ${st.rec.title} – ${st.rec.credit}`); });
  lines.push('', 'Prüfen: ' + BASE + '#k=' + chainCode(game));
  return lines.join('\n');
}

/* ---------- Prüfansicht ---------- */
async function startVerify(code){
  const parts = (code || '').split('.');
  const toks = parts.slice(2).map(parseToken);
  if(parts.length < 3 || !MBID.test(parts[0]) || !MBID.test(parts[1]) || !toks.every(tokenValid)){ toast('Das ist kein gültiger Prüf-Link'); return; }
  verify = { code, total:parts.length, done:0, status:'loading', g:null, problems:0, claims:0 };
  view = 'verify'; render();
  try{
    const s = { ...settings(), bandLinks:true };
    const startInfo = await artistInfo(parts[0], 'high'); verify.done++; updateVerifyProgress();
    const targetInfo = await artistInfo(parts[1], 'high'); verify.done++; updateVerifyProgress();
    const g = { ch:{ start:startInfo, target:targetInfo }, steps:[] };
    let prev = [startInfo];
    for(const t of toks){
      let rec;
      if(t.mbid){ rec = { ...(await getRecording(t.mbid)), spotifyId:t.sp || null }; }
      else {
        const arts = [];
        for(const aid of t.arts){ const ai = await artistInfo(aid, 'high'); arts.push({ id:ai.id, name:ai.name }); }
        const oe = await spOembed(t.sp);
        rec = { id:null, title:oe ? oe.title : 'Spotify-Song', artists:arts, credit:arts.map(a => a.name).join(', '), year:'', spotifyId:t.sp, noMb:true };
      }
      verify.done++; updateVerifyProgress();
      let link = await findLink(prev, rec.artists, s);
      if(!link){
        if(t.claim){ link = { type:'claim' }; verify.claims++; }
        else { link = { type:'bad', text:'keine Verbindung in MusicBrainz' }; verify.problems++; }
      }
      g.steps.push({ rec, link }); prev = rec.artists;
    }
    const last = g.steps[g.steps.length - 1];
    verify.reached = !!last && last.rec.artists.some(a => sameArtist(a, targetInfo));
    if(!verify.reached) verify.problems++;
    verify.g = g; verify.status = 'done';
  }catch(e){ verify.status = 'error'; verify.error = e.message; }
  render();
}
function updateVerifyProgress(){ const el = $('#vprog'); if(el) el.textContent = `${verify.done} von ${verify.total} Einträgen geladen`; }
function verifyView(){
  const v = verify;
  const back = `<div class="top"><button class="iconbtn" id="btnHome" aria-label="Zur Übersicht"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg></button><h2 style="flex:1">Kette prüfen</h2></div>`;
  if(v.status === 'loading') return back + `<div class="panel"><div class="busy"><span class="spin"></span><span id="vprog">${v.done} von ${v.total} Einträgen geladen</span></div><p class="muted small">MusicBrainz erlaubt etwa eine Anfrage pro Sekunde, das dauert also einen Moment.</p></div>`;
  if(v.status === 'error') return back + `<div class="verdict bad">Prüfung fehlgeschlagen: ${esc(v.error)}</div>`;
  const g = v.g;
  let verdict, cls;
  if(v.problems){ cls = 'bad'; verdict = (v.reached ? '' : 'Die Kette endet nicht bei der Zielband. ') + (v.problems - (v.reached ? 0 : 1) ? `${v.problems - (v.reached ? 0 : 1)} Glied(er) ohne Verbindung.` : ''); }
  else if(v.claims){ cls = 'claim'; verdict = `Gültig, aber ${v.claims} Glied(er) nur von der Gruppe bestätigt.`; }
  else { cls = 'ok'; verdict = 'Gültig. Jedes Glied ist in MusicBrainz belegt.'; }
  return back + `
  <div class="hero"><h1>${esc(g.ch.start.name)} → ${esc(g.ch.target.name)}</h1><div class="big">${g.steps.length}</div><span class="muted">Songs</span></div>
  <div class="verdict ${cls}">${esc(verdict)}</div>
  ${chainHtml(g, false)}
  ${!v.reached ? endpointNode(g.ch.target, 'Ziel nicht erreicht', false) : ''}
  <button class="btn block" id="btnVerifyLinks">Linkliste erstellen</button>
  <button class="btn ghost block" id="btnPlaySame">Diese Challenge selbst spielen</button>`;
}
function bindVerify(){
  $('#btnHome').onclick = () => { view = 'home'; verify = null; render(); };
  if($('#btnVerifyLinks')) $('#btnVerifyLinks').onclick = () => openLinkList(verify.g, { finished:!!verify.reached, code:verify.code });
  if($('#btnPlaySame')) $('#btnPlaySame').onclick = () => { const g = verify.g; verify = null; newGame(artistPick(g.ch.start), artistPick(g.ch.target), g.steps.length || null); };
}

/* ---------- Teilen ---------- */
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('Kopiert'); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Kopiert'); }catch(_){ toast('Kopieren nicht möglich'); } ta.remove(); }
}
async function shareText(t){
  if(navigator.share){ try{ await navigator.share({ text:t }); return; }catch(e){ if(e.name === 'AbortError') return; } }
  copyText(t);
}
function shareChallenge(a, b, best){
  const goal = best ? `Meine Kette hat ${best} Songs. Wer schafft es mit weniger?` : 'Wer schafft es mit den wenigsten Songs?';
  shareText(`Neue Band-Kette: ${a.name} → ${b.name}\n${goal}\n${BASE}#c=${a.id}.${b.id}${best ? '.' + best : ''}`);
}
async function readHash(){
  const h = location.hash;
  const k = h.match(/^#k=(.+)$/), c = h.match(/^#c=([0-9a-f-]{36})\.([0-9a-f-]{36})(?:\.(\d{1,3}))?$/);
  if(k || c) history.replaceState(null, '', BASE);
  if(k){ startVerify(decodeURIComponent(k[1])); return true; }
  if(c){
    toast('Challenge wird geladen …');
    try{ const a = await artistInfo(c[1], 'high'); const b = await artistInfo(c[2], 'high'); draft.start = artistPick(a); draft.target = artistPick(b); draft.best = c[3] ? +c[3] : null; view = 'home'; render(); }
    catch(e){ handleErr(e); }
  }
  return false;
}

/* ---------- Sheets ---------- */
function sheet(inner, onDismiss){
  $('#sheetRoot').innerHTML = `<div class="sheet" id="sheet"><div class="card" role="dialog" aria-modal="true">${inner}</div></div>`;
  $('#sheet').onclick = e => { if(e.target.id === 'sheet' || e.target.hasAttribute('data-close')){ closeSheet(); if(onDismiss) onDismiss(); } };
}
function closeSheet(){ $('#sheetRoot').innerHTML = ''; }

function openArtistSheet(which){
  sheet(`<h2>${which === 'start' ? 'Startband' : 'Zielband'} wählen</h2>
    <input type="search" id="aq" placeholder="Band oder Künstler" enterkeyhint="search" autocomplete="off">
    <div class="list" id="ares"><p class="muted small">Achte auf Land und Beschreibung, es gibt viele gleichnamige Bands.</p></div>
    <button class="btn ghost" data-close>Schließen</button>`);
  const inp = $('#aq'); setTimeout(() => inp.focus(), 50);
  let deb, list = [];
  inp.oninput = () => { clearTimeout(deb); deb = setTimeout(async () => {
    const q = inp.value.trim(); if(!q) return;
    $('#ares').innerHTML = '<div class="busy"><span class="spin"></span><span>Suche …</span></div>';
    try{
      list = await searchArtists(q);
      $('#ares').innerHTML = list.map((a, i) => `<button class="item" data-a="${i}"><div class="txt"><div class="t1">${esc(a.name)}</div><div class="t2">${esc(artistMeta(a)) || '&nbsp;'}</div></div></button>`).join('') || '<p class="muted small">Nichts gefunden</p>';
      $$('[data-a]').forEach(b => b.onclick = () => { draft[which] = list[+b.dataset.a]; draft.best = null; closeSheet(); render(); });
    }catch(e){ handleErr(e); }
  }, 600); };
}
function openSettings(){
  const s = settings();
  sheet(`<h2>Spielregeln</h2>
    <label class="toggle"><span>Band-Links erlauben<small>Ein Künstler ist oder war Mitglied der anderen Band, laut MusicBrainz.</small></span><input type="checkbox" id="sBand" ${s.bandLinks ? 'checked' : ''}></label>
    <label class="toggle"><span>Bandkollegen zählen<small>Zwei Künstler spielten in derselben Band, z. B. zwei Ex-Mitglieder.</small></span><input type="checkbox" id="sCol" ${s.colleagues ? 'checked' : ''}></label>
    <label class="toggle"><span>Unbelegte Glieder erlauben<small>Die Gruppe darf fehlende Einträge bestätigen. Sie werden markiert.</small></span><input type="checkbox" id="sClaim" ${s.claims ? 'checked' : ''}></label>
    <label class="toggle"><span>Tipps anzeigen<small>Blendet verbundene Bands als zusätzliche Suchfilter ein.</small></span><input type="checkbox" id="sHint" ${s.hints ? 'checked' : ''}></label>
    <label>Maximale Anzahl Songs (0 = unbegrenzt)<input type="text" inputmode="numeric" id="sMax" value="${s.maxSongs}"></label>
    <div class="row"><button class="btn ghost" data-close>Abbrechen</button><button class="btn primary" id="sSave">Speichern</button></div>
    <p class="muted small">Daten: MusicBrainz, die offene Musikdatenbank. Fehlt eine Verbindung, kann sie dort jeder nachtragen.</p>`);
  $('#sSave').onclick = () => {
    LS.set('settings', { maxSongs:Math.max(0, parseInt($('#sMax').value, 10) || 0), bandLinks:$('#sBand').checked,
      colleagues:$('#sCol').checked, claims:$('#sClaim').checked, hints:$('#sHint').checked });
    closeSheet(); toast('Gespeichert'); render();
  };
}

/* ---------- Homescreen-Symbol ---------- */
function makeIcon(){
  try{
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    x.fillStyle = '#FF6B3D'; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#15121F'; x.beginPath(); x.arc(56, 60, 22, 0, 7); x.fill(); x.beginPath(); x.arc(124, 120, 22, 0, 7); x.fill();
    x.strokeStyle = '#15121F'; x.lineWidth = 16; x.lineCap = 'round'; x.beginPath(); x.moveTo(70, 74); x.lineTo(110, 106); x.stroke();
    $('#touchIcon').href = c.toDataURL('image/png');
  }catch(e){}
}

/* ---------- Start ---------- */
(async function init(){
  makeIcon();
  if(game && !game.won){ view = 'game'; search.chip = firstWithId(anchors()); }
  const verifying = await readHash();
  if(!verifying){ render(); if(view === 'game'){ runSearch(true); prefetchAnchors(); } }
  window.addEventListener('hashchange', readHash);
})();
</script>
</body>
