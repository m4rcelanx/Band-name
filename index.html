/* ---------- Prüfansicht ---------- */
async function startVerify(code){
  const parts = (code || '').split('.');
  const toks = parts.slice(2).map(parseToken);
  if(parts.length < 3 || !MBID.test(parts[0]) || !MBID.test(parts[1]) || !toks.every(tokenValid)){ toast('Das ist kein gültiger Prüf-Link'); return; }
  verify = { code, total:parts.length, done:0, status:'loading', g:null, problems:0, claims:0 };
  view = 'verify'; render();
  try{
    const s = { ...settings(), bandLinks:true };
    const startInfo = await artistInfo(parts[0], 'high'); verify.done++; updateVerifyProgress();
    const targetInfo = await artistInfo(parts[1], 'high'); verify.done++; updateVerifyProgress();
    const g = { ch:{ start:startInfo, target:targetInfo }, steps:[] };
    let prev = [startInfo];
    for(const t of toks){
      let rec;
      if(t.mbid){ rec = { ...(await getRecording(t.mbid)), spotifyId:t.sp || null }; }
      else {
        const arts = [];
        for(const aid of t.arts){ const ai = await artistInfo(aid, 'high'); arts.push({ id:ai.id, name:ai.name }); }
        const oe = await spOembed(t.sp);
        rec = { id:null, title:oe ? oe.title : 'Spotify-Song', artists:arts, credit:arts.map(a => a.name).join(', '), year:'', spotifyId:t.sp, noMb:true };
      }
      verify.done++; updateVerifyProgress();
      let link = rec.remix ? { type:'bad', text:'Remix, zählt nicht' } : await findLink(prev, rec.artists, s);
      if(rec.remix) verify.problems++;
      if(!link){
        if(t.claim){ link = { type:'claim' }; verify.claims++; }
        else { link = { type:'bad', text:'keine Verbindung in MusicBrainz' }; verify.problems++; }
      }
      g.steps.push({ rec, link }); prev = rec.artists;
    }
    const last = g.steps[g.steps.length - 1];
    verify.reached = !!last && last.rec.artists.some(a => sameArtist(a, targetInfo));
    if(!verify.reached) verify.problems++;
    verify.g = g; verify.status = 'done';
  }catch(e){ verify.status = 'error'; verify.error = e.message; }
  render();
}
function updateVerifyProgress(){ const el = $('#vprog'); if(el) el.textContent = `${verify.done} von ${verify.total} Einträgen geladen`; }
function verifyView(){
  const v = verify;
  const back = `<div class="top"><button class="iconbtn" id="btnHome" aria-label="Zur Übersicht"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg></button><h2 style="flex:1">Kette prüfen</h2></div>`;
  if(v.status === 'loading') return back + `<div class="panel"><div class="busy"><span class="spin"></span><span id="vprog">${v.done} von ${v.total} Einträgen geladen</span></div><p class="muted small">MusicBrainz erlaubt etwa eine Anfrage pro Sekunde, das dauert also einen Moment.</p></div>`;
  if(v.status === 'error') return back + `<div class="verdict bad">Prüfung fehlgeschlagen: ${esc(v.error)}</div>`;
  const g = v.g;
  let verdict, cls;
  if(v.problems){ cls = 'bad'; verdict = (v.reached ? '' : 'Die Kette endet nicht bei der Zielband. ') + (v.problems - (v.reached ? 0 : 1) ? `${v.problems - (v.reached ? 0 : 1)} Glied(er) ohne Verbindung.` : ''); }
  else if(v.claims){ cls = 'claim'; verdict = `Gültig, aber ${v.claims} Glied(er) nur von der Gruppe bestätigt.`; }
  else { cls = 'ok'; verdict = 'Gültig. Jedes Glied ist in MusicBrainz belegt.'; }
  return back + `
  <div class="hero"><h1>${esc(g.ch.start.name)} → ${esc(g.ch.target.name)}</h1><div class="big">${g.steps.length}</div><span class="muted">Songs</span></div>
  <div class="verdict ${cls}">${esc(verdict)}</div>
  ${chainHtml(g, false)}
  ${!v.reached ? endpointNode(g.ch.target, 'Ziel nicht erreicht', false) : ''}
  <div class="panel"><span class="eyebrow">Andere Wege zum Ziel</span><div id="altList"></div></div>
  ${v.g && v.g.steps.length ? '<button class="btn block" id="btnVerifyPlay">▶ Kette anhören</button>' : ''}
  <button class="btn block" id="btnVerifyLinks">Linkliste erstellen</button>
  <button class="btn ghost block" id="btnPlaySame">Diese Challenge selbst spielen</button>`;
}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('Kopiert'); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Kopiert'); }catch(_){ toast('Kopieren nicht möglich'); } ta.remove(); }
}
async function shareText(t){
  if(navigator.share){ try{ await navigator.share({ text:t }); return; }catch(e){ if(e.name === 'AbortError') return; } }
  copyText(t);
}
function shareChallenge(a, b, best, duel){
  const goal = duel ? `${duel.name} hat es in ${best} Songs und ${fmtTime(duel.secs * 1000)} geschafft. Schlägst du das?` : best ? `Meine Kette hat ${best} Songs. Wer schafft es mit weniger?` : 'Wer schafft es mit den wenigsten Songs?';
  const tail = duel ? `.${best}~${duel.secs}~${encodeURIComponent(duel.name).replace(/\./g, '%2E')}` : best ? '.' + best : '';
  shareText(`${duel ? 'Duell' : 'Neue Band-Kette'}: ${a.name} → ${b.name}\n${goal}\n${BASE}#c=${a.id}.${b.id}${tail}`);
}
async function readHash(){
  const h = location.hash;
  const k = h.match(/^#k=(.+)$/), c = h.match(/^#c=([0-9a-f-]{36})\.([0-9a-f-]{36})(?:\.(\d{1,3})(?:~(\d{1,6})~([^~]{1,80}))?)?$/), d = h.match(/^#d=(\d{4}-\d{2}-\d{2})$/);
  if(k || c || d) history.replaceState(null, '', BASE);
  if(d && d[1] <= dayKey()){ setTimeout(() => guardRunning(() => startDaily(d[1])), 0); return false; }
  if(k){ startVerify(decodeURIComponent(k[1])); return true; }
  if(c){
    toast('Challenge wird geladen …');
    try{ const a = await artistInfo(c[1], 'high'); const b = await artistInfo(c[2], 'high'); draft.start = artistPick(a); draft.target = artistPick(b); draft.best = c[3] ? +c[3] : null;
      let nm = ''; try{ nm = c[5] ? decodeURIComponent(c[5]).slice(0, 20) : ''; }catch(e){}
      draft.duel = c[4] && nm ? { songs:+c[3], secs:+c[4], name:nm } : null; view = 'home'; render(); }
    catch(e){ handleErr(e); }
  }
  return false;
}

  const done = party.cur >= party.teams.length;
  const ranked = party.teams.map((t, i) => ({ ...t, i })).sort((x, y) => !x.res - !y.res || (y.res ? y.res.points : 0) - (x.res ? x.res.points : 0) || (x.res ? x.res.ms : 0) - (y.res ? y.res.ms : 0));
  return backBar('Party-Modus') + `
  <div class="panel"><span class="eyebrow">Aufgabe</span><h3>${esc(party.ch.start.name)} → ${esc(party.ch.target.name)}</h3>
    <span class="muted small">${party.par ? `Par ${party.par}` : 'Par unbekannt'}${party.timeLimit ? ` · ${party.timeLimit / 60} Minuten pro Team` : ''}</span>
    ${done ? '<div class="verdict ok">Alle Teams sind fertig</div>' : `<div class="verdict claim">${esc(party.teams[party.cur].name)} ist dran. Die anderen schauen weg.</div><button class="btn primary" id="pGo">${esc(party.teams[party.cur].name)}: Los geht’s</button>`}
  </div>
  <div class="panel"><span class="eyebrow">${done ? 'Endstand' : 'Zwischenstand'}</span><div class="list">${ranked.map((t, pos) => `<div class="item"><span class="num">${t.res ? pos + 1 : '–'}</span><div class="txt"><div class="t1">${esc(t.name)}</div><div class="t2">${t.res ? (t.res.gaveUp ? 'aufgegeben' : t.res.solved ? 'von der App gelöst' : `${t.res.n} Songs · ${fmtTime(t.res.ms)}${t.res.hints ? ` · ${t.res.hints} Tipps` : ''}`) : 'noch nicht gespielt'}</div></div>${t.res ? `<span class="tag ${t.res.points ? 'ok' : ''}">${t.res.points} P.</span>` : ''}${done && t.res && t.res.code ? `<button class="btn ghost" data-pcode="${t.i}" style="min-height:36px;padding:6px 10px">Kette</button>` : ''}</div>`).join('')}</div>
  </div>
  <button class="btn ghost block" id="pReset">${done ? 'Neue Party' : 'Party abbrechen'}</button>`;
}
function bindParty(){
  bindBack();
  const party = LS.get('party', null);
  if(!party){
    $$('[data-pick]').forEach(b => b.onclick = () => openArtistSheet(b.dataset.pick));
    $('#pRandom').onclick = () => openRandomSheet(() => { view = 'party'; render(); });
    $('#pStart').onclick = async () => {
      const teams = $('#pTeams').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 8);
      if(teams.length < 2){ toast('Mindestens zwei Teams eintragen'); return; }
      let par = null; try{ await loadGraph(); par = parFor(draft.start, draft.target); }catch(e){}
      LS.set('party', { ch:{ start:draft.start, target:draft.target }, par, timeLimit:(+$('#pTime').value || 0) * 1000, teams:teams.map(name => ({ name, res:null })), cur:0 });
      render();
    };
    return;
  }
  if($('#pGo')) $('#pGo').onclick = () => newGame(party.ch.start, party.ch.target, null, { kind:'party', team:party.cur, teamName:party.teams[party.cur].name, par:party.par, timeLimit:party.timeLimit || null });
  $$('[data-pcode]').forEach(b => b.onclick = () => startVerify(party.teams[+b.dataset.pcode].res.code));
  $('#pReset').onclick = () => { LS.del('party'); if(game && game.kind === 'party'){ game = null; LS.del('game'); } render(); };
}

/* ---------- Sheets ---------- */
function sheet(inner, onDismiss){
  $('#sheetRoot').innerHTML = `<div class="sheet" id="sheet"><div class="card" role="dialog" aria-modal="true">${inner}</div></div>`;
  $('#sheet').onclick = e => { if(e.target.id === 'sheet' || e.target.hasAttribute('data-close')){ closeSheet(); if(onDismiss) onDismiss(); } };
}
function closeSheet(){ $('#sheetRoot').innerHTML = ''; }

function openArtistSheet(which){
  sheet(`<h2>${which === 'start' ? 'Startband' : 'Zielband'} wählen</h2>
    <input type="search" id="aq" placeholder="Band oder Künstler" enterkeyhint="search" autocomplete="off">
    <div class="list" id="ares"><p class="muted small">Achte auf Land und Beschreibung, es gibt viele gleichnamige Bands.</p></div>
    <button class="btn ghost" data-close>Schließen</button>`);
  const inp = $('#aq'); setTimeout(() => inp.focus(), 50);
  let deb, list = [];
  inp.oninput = () => { clearTimeout(deb); deb = setTimeout(async () => {
    const q = inp.value.trim(); if(!q) return;
    $('#ares').innerHTML = '<div class="busy"><span class="spin"></span><span>Suche …</span></div>';
    try{
      list = await searchArtists(q);
      $('#ares').innerHTML = list.map((a, i) => `<button class="item" data-a="${i}"><div class="txt"><div class="t1">${esc(a.name)}</div><div class="t2">${esc(artistMeta(a)) || '&nbsp;'}</div></div></button>`).join('') || '<p class="muted small">Nichts gefunden</p>';
      $$('[data-a]').forEach(b => b.onclick = () => { draft[which] = list[+b.dataset.a]; draft.best = null; draft.duel = null; closeSheet(); render(); });
    }catch(e){ handleErr(e); }
  }, 600); };
}
function openSettings(){
  const s = settings();
  sheet(`<h2>Spielregeln</h2>
    <label>Dein Spielername (für Duelle)<input type="text" id="sName" maxlength="20" autocomplete="nickname" value="${esc(s.name || '')}"></label>
    <label class="toggle"><span>Band-Links erlauben<small>Ein Künstler ist oder war Mitglied der anderen Band, laut MusicBrainz.</small></span><input type="checkbox" id="sBand" ${s.bandLinks ? 'checked' : ''}></label>
    <label class="toggle"><span>Bandkollegen zählen<small>Zwei Künstler spielten in derselben Band, z. B. zwei Ex-Mitglieder.</small></span><input type="checkbox" id="sCol" ${s.colleagues ? 'checked' : ''}></label>
    <label class="toggle"><span>Unbelegte Glieder erlauben<small>Die Gruppe darf fehlende Einträge bestätigen. Sie werden markiert.</small></span><input type="checkbox" id="sClaim" ${s.claims ? 'checked' : ''}></label>
    <label class="toggle"><span>Tipps anzeigen<small>Blendet verbundene Bands als zusätzliche Suchfilter ein.</small></span><input type="checkbox" id="sHint" ${s.hints ? 'checked' : ''}></label>
    <label>Maximale Anzahl Songs (0 = unbegrenzt)<input type="text" inputmode="numeric" id="sMax" value="${s.maxSongs}"></label>
    <span class="eyebrow">Abspielen</span>
    <p class="muted small">Songs laufen direkt in der App. Standard ist der eingebettete Spotify-Player: Bist du im selben Browser bei Spotify angemeldet, laufen ganze Songs, sonst Hörproben. Was Spotify nicht hat, kommt als Hörprobe von Apple Music oder Deezer.</p>
    <label>Abspielen über<select id="sVia"><option value="spotify" ${s.playVia === 'apple' ? '' : 'selected'}>Spotify (Standard)</option><option value="apple" ${s.playVia === 'apple' ? 'selected' : ''}>Apple Music (mit Token und Abo)</option></select></label>
    <label class="toggle"><span>Ersatz-Hörproben<small>30 Sekunden von Apple Music oder Deezer, wenn Spotify den Song nicht hat.</small></span><input type="checkbox" id="sPrev" ${s.amPreview === false ? '' : 'checked'}></label>
    <label>Apple-Music-Land (zwei Buchstaben)<input type="text" id="sStore" maxlength="2" autocapitalize="off" value="${esc(s.amStore || 'de')}"></label>
    <label>Apple-Music-Entwicklertoken<textarea id="sTok" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="eyJ…">${esc(s.amToken || '')}</textarea></label>
    <p class="small" id="amInfo"></p>
    <button class="btn ghost" id="amTest">Musiksuche testen</button><p class="small" id="amTestOut"></p>
    <div class="row"><button class="btn ghost" id="amIn">Mit Apple Music anmelden</button><button class="btn ghost" id="amOut">Abmelden</button></div>
    <div class="row"><button class="btn ghost" data-close>Abbrechen</button><button class="btn primary" id="sSave">Speichern</button></div>
    <p class="muted small">Daten: MusicBrainz, die offene Musikdatenbank. Fehlt eine Verbindung, kann sie dort jeder nachtragen.</p>
    <span class="eyebrow">Musiknetz</span>
    <p class="small" id="netInfo">Wird geladen …</p>
    <button class="btn ghost" id="netClear">Gerät-Ergänzungen löschen</button>`);
  loadGraph().then(g => {
    const el = $('#netInfo'); if(!el) return;
    const base = g.baseN ? `MusicBrainz-Export vom ${esc((g.dump || '').slice(6, 8) + '.' + (g.dump || '').slice(4, 6) + '.' + (g.dump || '').slice(0, 4))}: ${g.baseN.toLocaleString('de-DE')} Künstler, ${(g.mCount + g.sCount).toLocaleString('de-DE')} belegte Verbindungen.` : 'Noch kein Musiknetz aus MusicBrainz vorhanden, die App sucht live.';
    el.textContent = `${base} Auf diesem Gerät aus Live-Suchen ergänzt: ${overlay.edges.length.toLocaleString('de-DE')} Verbindungen.`;
  });
  const amShow = async () => {
    const el = $('#amInfo'); if(!el) return;
    const tok = $('#sTok').value.trim() || (await amToken()), info = amTokenInfo(tok);
    if(!tok){ el.textContent = 'Kein Token eingetragen: nur Hörproben.'; return; }
    if(!info){ el.textContent = 'Token nicht lesbar.'; return; }
    const exp = info.exp ? info.exp.toLocaleDateString('de-DE') : 'unbekannt';
    el.textContent = (info.exp && info.exp < new Date() ? 'Token abgelaufen am ' + exp + '.' : 'Token gültig bis ' + exp + '.') + (amFull() ? ' Angemeldet: ganze Songs.' : ' Nicht angemeldet.');
  };
  amShow(); $('#sTok').oninput = amShow;
  $('#amTest').onclick = async () => { const o = $('#amTestOut'); o.textContent = 'Teste …'; LS.del('amMatch2'); try{ o.textContent = await amSelfTest(); }catch(e){ o.textContent = e.message; } };
  $('#amIn').onclick = async () => {
    const tok = $('#sTok').value.trim();
    if(tok && tok !== (settings().amToken || '')){ if(!amTokenInfo(tok)){ toast('Der Apple-Music-Token sieht nicht richtig aus'); return; } LS.set('settings', { ...LS.get('settings', {}), amToken:tok }); mk = null; mkLoading = null; }
    try{ if(await amSignIn()){ toast('Mit Apple Music verbunden'); amShow(); if(pl.queue.length) playList(pl.queue, pl.idx); } }catch(e){ toast(e.message || 'Anmeldung abgebrochen'); }
  };
  $('#amOut').onclick = async () => { await amSignOut(); toast('Von Apple Music abgemeldet'); amShow(); if(pl.queue.length){ pl.mode = 'preview'; plGo(pl.idx); } };
  $('#netClear').onclick = () => { overlay = { nodes:{}, edges:[] }; overlaySeen.clear(); LS.del('overlay'); graph = null; graphLoading = null; toast('Ergänzungen gelöscht'); closeSheet(); };
  $('#sSave').onclick = () => {
    const tok = $('#sTok').value.trim();
    if(tok && !amTokenInfo(tok)){ toast('Der Apple-Music-Token sieht nicht richtig aus'); return; }
    const store = /^[a-z]{2}$/i.test($('#sStore').value.trim()) ? $('#sStore').value.trim().toLowerCase() : 'de';
    if(tok !== (s.amToken || '') || store !== (s.amStore || 'de')){ mk = null; mkLoading = null; LS.del('amMatch2'); }
    LS.set('settings', { ...LS.get('settings', {}), name:$('#sName').value.trim().slice(0, 20), maxSongs:Math.max(0, parseInt($('#sMax').value, 10) || 0), bandLinks:$('#sBand').checked,
      colleagues:$('#sCol').checked, claims:$('#sClaim').checked, hints:$('#sHint').checked, amPreview:$('#sPrev').checked, amToken:tok, amStore:store, playVia:$('#sVia').value });
    closeSheet(); toast('Gespeichert'); render();
  };
}

/* ---------- Homescreen-Symbol ---------- */
function makeIcon(){
  try{
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    x.fillStyle = '#FF6B3D'; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#15121F'; x.beginPath(); x.arc(56, 60, 22, 0, 7); x.fill(); x.beginPath(); x.arc(124, 120, 22, 0, 7); x.fill();
    x.strokeStyle = '#15121F'; x.lineWidth = 16; x.lineCap = 'round'; x.beginPath(); x.moveTo(70, 74); x.lineTo(110, 106); x.stroke();
    $('#touchIcon').href = c.toDataURL('image/png');
  }catch(e){}
}

/* ---------- Start ---------- */
(async function init(){
  makeIcon(); LS.del('amMatch');
  if(game && !game.won){ view = 'game'; search.chip = firstWithId(anchors()); }
  const verifying = await readHash();
  if(!verifying){ render(); if(view === 'game'){ runSearch(true); prefetchAnchors(); } }
  window.addEventListener('hashchange', readHash);
})();
</script>
