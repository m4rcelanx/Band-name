name: Musiknetz bauen

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graph
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Netz aus Wikidata bauen
        run: node scripts/build-graph.mjs
      - name: Netz übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graph.json
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -m "Musiknetz aktualisiert"
          git pull --rebase origin main
          git push
